<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 실패 | 골든 시니어스</title>
  <style>
    :root {
      --teal: #0D4A38; --teal-dark: #083328; --teal-light: #E8F4F0;
      --gold: #C4973A; --gold-light: #FDF6E7; --gold-dark: #A07830;
      --navy: #0D4A38; --navy-light: #1A6B52;
      --red: #E74C3C; --red-light: #FDECEA;
      --gray-100: #F7F8FA; --gray-200: #EEEFF2;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --white: #FFFFFF;
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900); min-height: 100vh;
    }
    header {
      background: var(--navy); height: 64px;
      display: flex; align-items: center; padding: 0 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: white; text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    main { max-width: 480px; margin: 0 auto; padding: 48px 20px 80px; }

    .fail-card {
      background: var(--white); border-radius: 24px; padding: 40px 32px;
      box-shadow: var(--shadow-lg); text-align: center;
    }
    .fail-icon {
      width: 80px; height: 80px; background: var(--red-light);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 24px;
    }
    .fail-title {
      font-size: 24px; font-weight: 900; color: var(--navy); margin-bottom: 10px;
    }
    .fail-sub {
      font-size: 15px; color: var(--gray-600); line-height: 1.7; margin-bottom: 24px;
    }
    .error-box {
      background: var(--red-light); border-radius: 12px; padding: 16px 20px;
      margin-bottom: 32px; text-align: left;
    }
    .error-label { font-size: 12px; font-weight: 700; color: var(--red); margin-bottom: 6px; }
    .error-msg { font-size: 14px; color: var(--gray-900); font-weight: 600; }
    .error-code { font-size: 12px; color: var(--gray-400); margin-top: 4px; font-family: monospace; }

    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn-primary {
      width: 100%; padding: 16px; background: var(--navy); color: white;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 800;
      cursor: pointer; text-decoration: none; display: block; text-align: center;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--navy-light); }
    .btn-secondary {
      width: 100%; padding: 16px; background: var(--gray-200); color: var(--gray-900);
      border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
      cursor: pointer; text-decoration: none; display: block; text-align: center;
    }

    .help-text {
      font-size: 13px; color: var(--gray-400); margin-top: 20px; line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html" class="logo">
    <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h3l2-7 4 14 3-9 2 5h4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    골든 시니어스
  </a>
</header>

<main>
  <div class="fail-card">
    <div class="fail-icon">❌</div>
    <div class="fail-title">결제에 실패했어요</div>
    <div class="fail-sub">
      결제 처리 중 문제가 발생했어요.<br>
      아래 오류 내용을 확인하고 다시 시도해주세요.
    </div>

    <div class="error-box">
      <div class="error-label">오류 내용</div>
      <div class="error-msg" id="errorMessage">알 수 없는 오류가 발생했어요.</div>
      <div class="error-code" id="errorCode"></div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="goBackToPayment()">↩ 다시 결제하기</button>
      <a href="mypage.html" class="btn-secondary">내 서비스 현황으로 돌아가기</a>
    </div>

    <p class="help-text">
      계속 오류가 발생한다면 카드사 또는<br>
      토스페이먼츠 고객센터(1544-7772)에 문의해주세요.
    </p>
  </div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  });
  const db = firebase.firestore();

  const params  = new URLSearchParams(location.search);
  const code    = params.get('code')    || '';
  const message = params.get('message') || '결제가 취소되었거나 오류가 발생했어요.';
  const orderId = params.get('orderId') || '';

  // 다시 결제하기 — orderId에서 quoteId 추출해 payment.html로 이동
  window.goBackToPayment = function() {
    // orderId 형식: order-{quoteId8자}-{timestamp}
    const parts = orderId.split('-');
    if (parts.length >= 2) {
      // Firestore에서 quoteId를 가져오는 대신, 세션스토리지에 저장된 값 활용
      const savedQuoteId = sessionStorage.getItem('lastQuoteId') || '';
      if (savedQuoteId) {
        location.href = `payment.html?quoteId=${savedQuoteId}`;
        return;
      }
    }
    location.href = 'mypage.html';
  };

  // 오류 메시지 표시
  document.getElementById('errorMessage').textContent = decodeURIComponent(message);
  if (code) {
    document.getElementById('errorCode').textContent = `오류 코드: ${code}`;
  }

  // Firestore payment 문서를 failed로 업데이트
  if (orderId) {
    firebase.auth().onAuthStateChanged(user => {
      if (!user) return;
      db.collection('payments').doc(orderId).update({
        status:   'failed',
        failCode: code,
        failMsg:  decodeURIComponent(message),
        failedAt: firebase.firestore.FieldValue.serverTimestamp(),
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
