<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선생님 찾기 | 골든 시니어스</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0D4A38; --teal-dark: #083328; --teal-light: #E8F4F0; --teal-pale: #F2FAF7;
      --gold: #C4973A; --gold-light: #FDF6E7; --gold-dark: #A07830;
      --white: #FFFFFF;
      --gray-100: #F8F9FA; --gray-200: #E9ECEF; --gray-400: #9CA3AF;
      --gray-600: #6B7280; --gray-900: #1F2937;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-100); color: var(--gray-900);
    }

    /* ===== 헤더 ===== */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--teal-dark); height: 64px;
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.12); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; transition: background 0.2s; flex-shrink: 0;
      text-decoration: none;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .back-btn svg { width:20px; height:20px; }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: white; text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-count {
      margin-left: auto; background: rgba(255,255,255,0.15);
      color: white; font-size: 13px; font-weight: 700;
      padding: 6px 14px; border-radius: 100px; white-space: nowrap;
    }

    /* ===== 메인 ===== */
    main { padding-top: 64px; }
    .container { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }

    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 22px; font-weight: 900; color: var(--teal); margin-bottom: 6px; }
    .page-header p  { font-size: 14px; color: var(--gray-600); }

    /* ===== 필터 ===== */
    .filter-section {
      background: var(--white); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow-md); margin-bottom: 24px;
    }
    .filter-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .filter-row + .filter-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
    .filter-label {
      font-size: 12px; font-weight: 800; color: var(--gray-400);
      width: 60px; flex-shrink: 0; letter-spacing: 0.3px;
    }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .f-chip {
      padding: 6px 14px; border-radius: 100px; font-size: 13px; font-weight: 700;
      border: 1.5px solid var(--gray-200); background: var(--white);
      cursor: pointer; transition: all 0.18s; color: var(--gray-600);
    }
    .f-chip.active { border-color: var(--teal); background: var(--teal); color: var(--white); }
    .f-chip:hover:not(.active) { border-color: var(--teal); color: var(--teal); }
    .filter-reset {
      margin-left: auto; font-size: 13px; color: var(--gray-400);
      background: none; border: none; cursor: pointer; font-weight: 600;
      transition: color 0.2s; flex-shrink: 0;
    }
    .filter-reset:hover { color: var(--teal); }

    /* 결과 바 */
    .result-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .result-count { font-size: 14px; color: var(--gray-600); font-weight: 600; }
    .result-count strong { color: var(--teal); }
    .sort-select {
      padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
      border: 1.5px solid var(--gray-200); background: var(--white); color: var(--teal);
      cursor: pointer; outline: none;
    }
    .sort-select:focus { border-color: var(--teal); }

    /* ===== 그리드 ===== */
    .teachers-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    }
    .t-card {
      background: var(--white); border-radius: 20px;
      box-shadow: var(--shadow-md); overflow: hidden;
      text-decoration: none; color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column;
      border: 2px solid transparent;
    }
    .t-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .t-card.best { border-color: var(--gold); }

    .t-badge-bar {
      background: var(--gold); color: var(--white);
      font-size: 11px; font-weight: 800; padding: 5px 14px;
      display: flex; align-items: center; gap: 5px;
    }
    .t-avatar-wrap {
      padding: 20px 20px 0;
      display: flex; justify-content: center;
    }
    .t-avatar {
      width: 80px; height: 80px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .t-info {
      padding: 16px 20px 20px; flex: 1; display: flex; flex-direction: column;
    }
    .t-name { font-size: 16px; font-weight: 900; color: var(--teal); margin-bottom: 4px; }
    .t-spec { font-size: 12px; color: var(--gray-600); margin-bottom: 10px; line-height: 1.5; }
    .t-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .t-tag {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 100px;
      background: var(--teal-light); color: var(--teal);
    }
    .t-tag.green { background: #EAF8EF; color: #15803d; }
    .t-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;
    }
    .t-stat {
      background: var(--teal-pale); border-radius: 10px;
      padding: 8px 10px; text-align: center;
    }
    .t-stat .v { font-size: 14px; font-weight: 900; color: var(--teal); display: block; }
    .t-stat .l { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
    .t-star { color: var(--gold); }
    .t-price { font-size: 17px; font-weight: 900; color: var(--teal); margin-bottom: 6px; }
    .t-price span { font-size: 13px; font-weight: 500; color: var(--gray-600); }
    .t-region { font-size: 12px; color: var(--gray-400); margin-bottom: 14px; display: flex; align-items: center; gap: 4px; }
    .t-region svg { flex-shrink: 0; }
    .t-btn {
      display: block; width: 100%; padding: 12px;
      background: var(--teal); color: var(--white);
      border: none; border-radius: 12px; font-size: 14px; font-weight: 800;
      cursor: pointer; text-decoration: none; text-align: center;
      transition: background 0.2s; margin-top: auto;
    }
    .t-btn:hover { background: var(--teal-dark); }
    .t-btn.gold { background: var(--gold); }
    .t-btn.gold:hover { background: var(--gold-dark); }

    /* 스켈레톤 로딩 */
    .skeleton {
      background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 50%, var(--gray-100) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite; border-radius: 8px;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .t-card-skeleton { background: var(--white); border-radius: 20px; box-shadow: var(--shadow-md); padding: 20px; }

    /* 빈 결과 */
    .empty-state {
      grid-column: 1 / -1; text-align: center;
      padding: 60px 20px; background: var(--white);
      border-radius: 20px; box-shadow: var(--shadow-md);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--teal); margin-bottom: 8px; }
    .empty-state p  { font-size: 14px; color: var(--gray-600); }

    @media (max-width: 800px) {
      .teachers-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) {
      .teachers-grid { grid-template-columns: 1fr; }
      .filter-label { width: 50px; }
    }
  </style>
</head>
<body>

<header>
  <a href="javascript:history.back()" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <a href="../index.html" class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    골든 시니어스
  </a>
  <div class="header-count" id="headerCount">불러오는 중…</div>
</header>

<main>
  <div class="container">

    <div class="page-header">
      <h1>우리 동네 재활운동사 찾기</h1>
      <p>자격증 검증 · 신원 인증 완료 선생님만 등록되어 있어요</p>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-row">
        <div class="filter-label">전문분야</div>
        <div class="filter-chips" id="specFilter">
          <span class="f-chip active" onclick="setFilter(this,'spec','all')">전체</span>
          <span class="f-chip" onclick="setFilter(this,'spec','뇌졸중')">뇌졸중</span>
          <span class="f-chip" onclick="setFilter(this,'spec','관절')">관절·수술</span>
          <span class="f-chip" onclick="setFilter(this,'spec','낙상')">낙상 예방</span>
          <span class="f-chip" onclick="setFilter(this,'spec','근력')">근력 강화</span>
          <span class="f-chip" onclick="setFilter(this,'spec','파킨슨')">파킨슨</span>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">자격증</div>
        <div class="filter-chips" id="licFilter">
          <span class="f-chip active" onclick="setFilter(this,'lic','all')">전체</span>
          <span class="f-chip" onclick="setFilter(this,'lic','물리치료사')">물리치료사</span>
          <span class="f-chip" onclick="setFilter(this,'lic','운동처방사')">운동처방사</span>
          <span class="f-chip" onclick="setFilter(this,'lic','스포츠재활사')">스포츠재활사</span>
        </div>
        <button class="filter-reset" onclick="resetFilters()">초기화</button>
      </div>
      <div class="filter-row">
        <div class="filter-label">가격대</div>
        <div class="filter-chips" id="priceFilter">
          <span class="f-chip active" onclick="setFilter(this,'price','all')">전체</span>
          <span class="f-chip" onclick="setFilter(this,'price','50000')">5만원대</span>
          <span class="f-chip" onclick="setFilter(this,'price','60000')">6만원대</span>
          <span class="f-chip" onclick="setFilter(this,'price','70000')">7만원 이상</span>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">지역</div>
        <div class="filter-chips" id="areaFilter" style="flex-wrap:wrap;">
          <span class="f-chip active" onclick="setFilter(this,'area','all')">전체</span>
          <span class="f-chip" onclick="setFilter(this,'area','강동구')">강동구</span>
          <span class="f-chip" onclick="setFilter(this,'area','강남구')">강남구</span>
          <span class="f-chip" onclick="setFilter(this,'area','서초구')">서초구</span>
          <span class="f-chip" onclick="setFilter(this,'area','송파구')">송파구</span>
          <span class="f-chip" onclick="setFilter(this,'area','마포구')">마포구</span>
          <span class="f-chip" onclick="setFilter(this,'area','성동구')">성동구</span>
          <span class="f-chip" onclick="setFilter(this,'area','노원구')">노원구</span>
          <span class="f-chip" onclick="setFilter(this,'area','강서구')">강서구</span>
          <span class="f-chip" onclick="setFilter(this,'area','영등포구')">영등포구</span>
          <span class="f-chip" onclick="setFilter(this,'area','용산구')">용산구</span>
        </div>
      </div>
    </div>

    <!-- 결과 바 -->
    <div class="result-bar">
      <div class="result-count"><strong id="resultNum">0</strong>명의 선생님을 찾았어요</div>
      <select class="sort-select" onchange="sortTeachers(this.value)">
        <option value="rating">평점 높은순</option>
        <option value="review">후기 많은순</option>
        <option value="price_asc">가격 낮은순</option>
        <option value="career">경력 많은순</option>
      </select>
    </div>

    <!-- 선생님 목록 -->
    <div class="teachers-grid" id="teacherGrid">
      <!-- 스켈레톤 로딩 -->
      <div class="t-card-skeleton" id="sk1"><div class="skeleton" style="height:80px;margin-bottom:12px;border-radius:16px;"></div><div class="skeleton" style="height:18px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:80%;margin-bottom:16px;"></div><div class="skeleton" style="height:60px;"></div></div>
      <div class="t-card-skeleton" id="sk2"><div class="skeleton" style="height:80px;margin-bottom:12px;border-radius:16px;"></div><div class="skeleton" style="height:18px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:80%;margin-bottom:16px;"></div><div class="skeleton" style="height:60px;"></div></div>
      <div class="t-card-skeleton" id="sk3"><div class="skeleton" style="height:80px;margin-bottom:12px;border-radius:16px;"></div><div class="skeleton" style="height:18px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:14px;width:80%;margin-bottom:16px;"></div><div class="skeleton" style="height:60px;"></div></div>
    </div>

  </div>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  });
  const db = firebase.firestore();

  // ── 아바타 색상 ──
  const AVATAR_COLORS = ['#0D4A38','#C4973A','#1A6B52','#16A34A','#2563EB','#7C3AED','#DC2626','#D97706','#0891B2','#374151'];
  const PERSON_SVG = (size, stroke='white') =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

  function avatarColor(uid) {
    let h = 0;
    for (let i = 0; i < (uid||'').length; i++) h = (h * 31 + uid.charCodeAt(i)) & 0xffffffff;
    return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
  }

  const MAP_PIN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
  const STAR_SVG = `<svg viewBox="0 0 24 24" fill="var(--gold)" stroke="var(--gold)" stroke-width="1.5" width="13" height="13"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  const CHECK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="11" height="11"><polyline points="20 6 9 17 4 12"/></svg>`;
  const TROPHY_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17a1 1 0 0 1-1 1H7"/><path d="M14 14.66V17a1 1 0 0 0 1 1h2"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`;

  // ── 데이터 ──
  let allTeachers = [];
  const activeFilters = { spec: 'all', lic: 'all', price: 'all', area: 'all' };
  let currentSort = 'rating';

  // ── 카드 렌더링 ──
  function renderCard(t, isBest) {
    const uid    = t.id;
    const d      = t;
    const color  = avatarColor(uid);
    const rating = d.rating > 0 ? d.rating.toFixed(2) : '신규';
    const visits = d.visitCount || 0;
    const reviews= d.reviewCount || 0;
    const career = d.careerYears || (d.career ? parseInt(d.career) : 0);
    const price  = d.price ? parseInt(String(d.price).replace(/[^0-9]/g,'')) : 0;
    const priceStr = price > 0 ? price.toLocaleString() + '원' : '문의';
    const area   = d.area || d.region || '';
    const specs  = (d.specialties || []).slice(0,3);
    const license = d.license || d.qualifications || '';

    // 필터용 data attributes
    const specJoined = specs.join(' ');
    const priceData  = price || 0;
    const careerData = career || 0;
    const ratingData = d.rating || 0;
    const reviewData = reviews || 0;

    const bestBadge = isBest
      ? `<div class="t-badge-bar">${TROPHY_SVG} 이달의 베스트 선생님</div>` : '';

    return `
      <a class="t-card${isBest?' best':''}" href="teacher.html?uid=${uid}"
         data-spec="${specJoined}" data-lic="${license}"
         data-price="${priceData}" data-rating="${ratingData}"
         data-reviews="${reviewData}" data-career="${careerData}">
        ${bestBadge}
        <div class="t-avatar-wrap">
          <div class="t-avatar" style="background:${color}">
            ${d.photoURL
              ? `<img src="${d.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:18px;" alt="${d.name}">`
              : PERSON_SVG(40)}
          </div>
        </div>
        <div class="t-info">
          <div class="t-name">${d.name || '선생님'}</div>
          <div class="t-spec">${d.intro ? d.intro.slice(0,40) + (d.intro.length>40?'…':'') : (specs.join(' · ') || '방문 재활운동')}</div>
          <div class="t-tags">
            ${license ? `<span class="t-tag">${license}</span>` : ''}
            <span class="t-tag green">${CHECK_SVG} 신원인증</span>
          </div>
          <div class="t-stats">
            <div class="t-stat"><span class="v">${STAR_SVG} ${rating}</span><div class="l">평점</div></div>
            <div class="t-stat"><span class="v">${reviews > 0 ? reviews+'개' : '-'}</span><div class="l">후기</div></div>
            <div class="t-stat"><span class="v">${visits > 0 ? visits+'회' : '-'}</span><div class="l">누적 방문</div></div>
            <div class="t-stat"><span class="v">${career > 0 ? career+'년' : '신규'}</span><div class="l">경력</div></div>
          </div>
          <div class="t-price">${priceStr} <span>/ 1회 방문</span></div>
          ${area ? `<div class="t-region">${MAP_PIN_SVG} ${area}</div>` : ''}
          <div class="t-btn${isBest?' gold':''}">프로필 보기 →</div>
        </div>
      </a>`;
  }

  function renderGrid() {
    const grid = document.getElementById('teacherGrid');
    // 스켈레톤 제거
    ['sk1','sk2','sk3'].forEach(id => { const el = document.getElementById(id); if(el) el.remove(); });

    let filtered = allTeachers.filter((t,i) => {
      const spec  = (t.specialties||[]).join(' ');
      const lic   = t.license || t.qualifications || '';
      const price = t.price ? parseInt(String(t.price).replace(/[^0-9]/g,'')) : 0;
      const area    = Array.isArray(t.area) ? t.area : (t.area || t.region || '').split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
      const specOk  = activeFilters.spec  === 'all' || spec.includes(activeFilters.spec);
      const licOk   = activeFilters.lic   === 'all' || lic.includes(activeFilters.lic);
      const priceOk = activeFilters.price === 'all' ||
        (activeFilters.price === '50000' && price >= 50000 && price < 60000) ||
        (activeFilters.price === '60000' && price >= 60000 && price < 70000) ||
        (activeFilters.price === '70000' && price >= 70000);
      const areaOk  = activeFilters.area  === 'all' || area.includes(activeFilters.area);
      return specOk && licOk && priceOk && areaOk;
    });

    // 정렬
    filtered.sort((a, b) => {
      if (currentSort === 'rating')    return (b.rating||0) - (a.rating||0);
      if (currentSort === 'review')    return (b.reviewCount||0) - (a.reviewCount||0);
      if (currentSort === 'price_asc') {
        const pa = a.price ? parseInt(String(a.price).replace(/[^0-9]/g,'')) : 999999;
        const pb = b.price ? parseInt(String(b.price).replace(/[^0-9]/g,'')) : 999999;
        return pa - pb;
      }
      if (currentSort === 'career')    return (b.careerYears||0) - (a.careerYears||0);
      return 0;
    });

    // 기존 카드 제거
    grid.querySelectorAll('.t-card, .empty-state').forEach(el => el.remove());

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="52" height="52"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <h3>조건에 맞는 선생님이 없어요</h3>
        <p>필터를 조정하거나 초기화해보세요.</p>
      </div>`;
    } else {
      // 가장 높은 평점 = best (첫 번째)
      const topRated = [...filtered].sort((a,b) => (b.rating||0)-(a.rating||0));
      const bestId = topRated[0]?.id;
      filtered.forEach(t => {
        grid.insertAdjacentHTML('beforeend', renderCard(t, t.id === bestId));
      });
    }

    const count = filtered.length;
    document.getElementById('resultNum').textContent = count;
    document.getElementById('headerCount').textContent = `선생님 ${count}명`;
  }

  // ── Firestore 로딩 ──
  async function loadTeachers() {
    try {
      const snap = await db.collection('users')
        .where('role', '==', 'teacher')
        .where('status', '==', 'active')
        .get();

      allTeachers = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      // active가 없으면 pending 포함해서 재시도
      if (allTeachers.length === 0) {
        const snap2 = await db.collection('users')
          .where('role', '==', 'teacher')
          .get();
        allTeachers = snap2.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      }

      renderGrid();
    } catch(e) {
      console.error('선생님 로딩 실패:', e);
      const grid = document.getElementById('teacherGrid');
      ['sk1','sk2','sk3'].forEach(id => { const el = document.getElementById(id); if(el) el.remove(); });
      grid.innerHTML = `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.5" width="52" height="52"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <h3>데이터를 불러올 수 없어요</h3>
        <p>잠시 후 다시 시도해주세요.</p>
      </div>`;
      document.getElementById('headerCount').textContent = '선생님 0명';
    }
  }

  // ── 필터/정렬 ──
  function setFilter(el, type, value) {
    const groupId = { spec: 'specFilter', lic: 'licFilter', price: 'priceFilter', area: 'areaFilter' }[type];
    document.getElementById(groupId).querySelectorAll('.f-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    activeFilters[type] = value;
    renderGrid();
  }

  function resetFilters() {
    ['specFilter','licFilter','priceFilter','areaFilter'].forEach(id => {
      document.getElementById(id).querySelectorAll('.f-chip').forEach((c,i) => c.classList.toggle('active', i===0));
    });
    activeFilters.spec = activeFilters.lic = activeFilters.price = activeFilters.area = 'all';
    renderGrid();
  }

  function sortTeachers(type) {
    currentSort = type;
    renderGrid();
  }

  loadTeachers();
</script>

</body>
</html>
