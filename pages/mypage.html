<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 | 골든 시니어스</title>
  <style>
    :root {
      --gold: #F5A623; --gold-light: #FFF8EC; --gold-dark: #D4891A;
      --navy: #1A2B4A; --navy-light: #2C3E6B;
      --green: #2ECC71; --green-light: #EAFAF1;
      --red: #E74C3C;
      --gray-100: #F7F8FA; --gray-200: #EEEFF2;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --white: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.07);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--white); border-bottom: 1px solid var(--gray-200);
      height: 64px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: var(--navy); text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .btn-small {
      padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
      text-decoration: none; cursor: pointer; border: none; transition: all 0.2s;
    }
    .btn-outline { background: var(--gray-100); color: var(--gray-600); border: 1.5px solid var(--gray-200); }
    .btn-outline:hover { border-color: var(--navy); color: var(--navy); }
    .btn-gold { background: var(--gold); color: var(--white); }
    .btn-gold:hover { background: var(--gold-dark); }

    /* ─── LAYOUT ─── */
    .container { max-width: 800px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ─── 프로필 카드 ─── */
    .profile-card {
      background: linear-gradient(135deg, var(--navy) 0%, #2C3E6B 100%);
      border-radius: 20px; padding: 28px 28px;
      color: var(--white); display: flex; align-items: center; gap: 20px;
      margin-bottom: 24px; position: relative; overflow: hidden;
    }
    .profile-card::before {
      content: ''; position: absolute; right: -20px; top: -20px;
      width: 140px; height: 140px;
      background: rgba(245,166,35,0.15); border-radius: 50%;
    }
    .profile-avatar {
      width: 64px; height: 64px; background: var(--gold); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .profile-info { flex: 1; }
    .profile-name { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
    .profile-email { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 10px; }
    .profile-stats { display: flex; gap: 20px; }
    .profile-stat { text-align: center; }
    .profile-stat-num { font-size: 20px; font-weight: 900; color: var(--gold); }
    .profile-stat-label { font-size: 11px; color: rgba(255,255,255,0.65); }

    /* ─── 탭 ─── */
    .tabs {
      display: flex; gap: 4px; background: var(--gray-200);
      border-radius: 14px; padding: 4px; margin-bottom: 20px;
    }
    .tab {
      flex: 1; padding: 10px; text-align: center;
      font-size: 14px; font-weight: 700; color: var(--gray-400);
      border-radius: 11px; cursor: pointer; transition: all 0.2s; border: none;
      background: transparent;
    }
    .tab.active { background: var(--white); color: var(--navy); box-shadow: var(--shadow-sm); }

    /* ─── 섹션 타이틀 ─── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title { font-size: 16px; font-weight: 800; color: var(--navy); }

    /* ─── 견적 카드 ─── */
    .quote-card {
      background: var(--white); border-radius: 16px;
      padding: 20px; margin-bottom: 12px;
      box-shadow: var(--shadow-sm); border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }
    .quote-card:hover { border-color: var(--gold); }
    .quote-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
    .quote-title { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .quote-meta  { font-size: 12px; color: var(--gray-400); }
    .badge {
      padding: 4px 10px; border-radius: 100px;
      font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .badge-open     { background: #EFF6FF; color: #2563EB; }
    .badge-matched  { background: var(--green-light); color: #16A34A; }
    .badge-closed   { background: var(--gray-200); color: var(--gray-400); }
    .badge-expired  { background: #FEF2F2; color: var(--red); }

    .quote-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag {
      padding: 4px 10px; background: var(--gray-100);
      border-radius: 100px; font-size: 12px; font-weight: 600; color: var(--gray-600);
    }
    .quote-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px; border-top: 1px solid var(--gray-100);
    }
    .quote-id { font-size: 11px; color: var(--gray-400); font-family: monospace; }
    .btn-view {
      padding: 8px 16px; background: var(--navy); color: var(--white);
      border-radius: 10px; font-size: 13px; font-weight: 700;
      text-decoration: none; transition: background 0.2s; border: none; cursor: pointer;
    }
    .btn-view:hover { background: var(--navy-light); }

    /* ─── 빈 상태 ─── */
    .empty-state {
      text-align: center; padding: 60px 20px;
      background: var(--white); border-radius: 16px; box-shadow: var(--shadow-sm);
    }
    .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 24px; line-height: 1.7; }

    /* ─── 로딩 ─── */
    .loading {
      text-align: center; padding: 60px 20px; color: var(--gray-400);
    }
    .loading-spinner {
      width: 36px; height: 36px; margin: 0 auto 16px;
      border: 3px solid var(--gray-200); border-top-color: var(--navy);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── 정보 수정 탭 ─── */
    .info-card {
      background: var(--white); border-radius: 16px; padding: 24px;
      box-shadow: var(--shadow-sm); margin-bottom: 12px;
    }
    .info-row { margin-bottom: 16px; }
    .info-label { font-size: 12px; font-weight: 700; color: var(--gray-400); margin-bottom: 6px; }
    .info-value { font-size: 15px; font-weight: 600; color: var(--gray-900); }
    .info-input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-200);
      border-radius: 10px; font-size: 15px; outline: none; font-family: inherit;
      transition: border-color 0.2s; background: var(--gray-100);
    }
    .info-input:focus { border-color: var(--navy); background: var(--white); }

    /* 탭 패널 */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    @media (max-width: 600px) {
      .profile-card { flex-direction: column; text-align: center; }
      .profile-stats { justify-content: center; }
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html" class="logo">
    <div class="logo-icon">🏃</div>
    골든 시니어스
  </a>
  <div class="header-right">
    <a href="../index.html#calc" class="btn-small btn-gold">+ 새 견적 신청</a>
    <button class="btn-small btn-outline" onclick="handleLogout()">로그아웃</button>
  </div>
</header>

<div class="container">

  <!-- 프로필 카드 -->
  <div class="profile-card" id="profileCard">
    <div class="profile-avatar" id="profileAvatar">👤</div>
    <div class="profile-info">
      <div class="profile-name" id="profileName">불러오는 중...</div>
      <div class="profile-email" id="profileEmail"></div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat-num" id="statTotal">0</div>
          <div class="profile-stat-label">전체 견적</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-num" id="statOpen">0</div>
          <div class="profile-stat-label">진행 중</div>
        </div>
        <div class="profile-stat">
          <div class="profile-stat-num" id="statMatched">0</div>
          <div class="profile-stat-label">매칭 완료</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('quotes', this)">📋 내 견적 신청</button>
    <button class="tab" onclick="switchTab('info', this)">👤 내 정보</button>
  </div>

  <!-- 견적 탭 -->
  <div class="tab-panel active" id="panelQuotes">
    <div class="section-header">
      <div class="section-title">견적 신청 내역</div>
    </div>
    <div id="quotesList">
      <div class="loading">
        <div class="loading-spinner"></div>
        불러오는 중...
      </div>
    </div>
  </div>

  <!-- 내 정보 탭 -->
  <div class="tab-panel" id="panelInfo">
    <div class="info-card">
      <div class="section-title" style="margin-bottom:20px;">내 정보 수정</div>
      <div class="info-row">
        <div class="info-label">이름</div>
        <input class="info-input" id="editName" type="text" placeholder="이름">
      </div>
      <div class="info-row">
        <div class="info-label">전화번호</div>
        <input class="info-input" id="editPhone" type="tel" placeholder="010-0000-0000">
      </div>
      <div class="info-row">
        <div class="info-label">이메일</div>
        <input class="info-input" id="editEmail" type="email" disabled style="opacity:0.5;cursor:not-allowed;">
        <div style="font-size:11px;color:var(--gray-400);margin-top:4px;">이메일은 변경할 수 없어요</div>
      </div>
      <button class="btn-view" style="width:100%;padding:14px;font-size:15px;" onclick="saveInfo()">
        저장하기
      </button>
    </div>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  });
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUser = null;

  // ── 인증 확인 ──
  auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    await loadProfile(user);
    await loadQuotes(user.uid);
  });

  // ── 프로필 로드 ──
  async function loadProfile(user) {
    const snap = await db.collection('users').doc(user.uid).get();
    const data = snap.exists ? snap.data() : {};

    const name  = data.name  || user.displayName || '이름 없음';
    const email = data.email || user.email;
    const phone = data.phone || '';

    document.getElementById('profileName').textContent  = `${name}님`;
    document.getElementById('profileEmail').textContent = email;
    document.getElementById('profileAvatar').textContent = name.charAt(0) || '👤';

    document.getElementById('editName').value  = name;
    document.getElementById('editPhone').value = phone.replace(/(\d{3})(\d{3,4})(\d{4})/, '$1-$2-$3');
    document.getElementById('editEmail').value = email;
  }

  // ── 견적 목록 로드 ──
  async function loadQuotes(uid) {
    const list = document.getElementById('quotesList');
    try {
      const snap = await db.collection('quotes')
        .where('userId', '==', uid)
        .orderBy('createdAt', 'desc')
        .get();

      if (snap.empty) {
        renderEmpty(); return;
      }

      const quotes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const total   = quotes.length;
      const open    = quotes.filter(q => q.status === 'open').length;
      const matched = quotes.filter(q => q.status === 'matched').length;
      document.getElementById('statTotal').textContent   = total;
      document.getElementById('statOpen').textContent    = open;
      document.getElementById('statMatched').textContent = matched;

      list.innerHTML = quotes.map(q => renderQuoteCard(q)).join('');

    } catch (err) {
      // 인덱스 미생성 시 단순 조회로 폴백
      try {
        const snap2 = await db.collection('quotes').where('userId', '==', uid).get();
        if (snap2.empty) { renderEmpty(); return; }
        const quotes = snap2.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        list.innerHTML = quotes.map(q => renderQuoteCard(q)).join('');
        updateStats(quotes);
      } catch(e2) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">불러오기 실패</div><div class="empty-sub">${e2.message}</div></div>`;
      }
    }
  }

  function updateStats(quotes) {
    document.getElementById('statTotal').textContent   = quotes.length;
    document.getElementById('statOpen').textContent    = quotes.filter(q => q.status === 'open').length;
    document.getElementById('statMatched').textContent = quotes.filter(q => q.status === 'matched').length;
  }

  function renderQuoteCard(q) {
    const statusMap = {
      'open':    { label: '🔵 견적 모집 중',  cls: 'badge-open' },
      'matched': { label: '✅ 매칭 완료',      cls: 'badge-matched' },
      'closed':  { label: '종료',              cls: 'badge-closed' },
      'expired': { label: '⏰ 만료됨',         cls: 'badge-expired' },
    };
    const st = statusMap[q.status] || statusMap['open'];
    const date = q.createdAt ? new Date(q.createdAt.seconds * 1000).toLocaleDateString('ko-KR') : '';
    const tags = [q.condition, q.region, q.budget, q.freq].filter(Boolean);

    return `
    <div class="quote-card">
      <div class="quote-card-top">
        <div>
          <div class="quote-title">${q.condition || '재활운동 신청'} · ${q.region || '지역 미입력'}</div>
          <div class="quote-meta">${date} 신청</div>
        </div>
        <span class="badge ${st.cls}">${st.label}</span>
      </div>
      <div class="quote-tags">
        ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
        ${q.ageGroup ? `<span class="tag">${q.ageGroup}</span>` : ''}
        ${q.mobility ? `<span class="tag">${q.mobility}</span>` : ''}
      </div>
      <div class="quote-footer">
        <span class="quote-id">#${q.id.substring(0,8).toUpperCase()}</span>
        <button class="btn-view" onclick="viewQuote('${q.id}')">견적 보기 →</button>
      </div>
    </div>`;
  }

  function renderEmpty() {
    document.getElementById('quotesList').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">아직 견적 신청이 없어요</div>
      <div class="empty-sub">지금 바로 전문 재활운동사에게<br>무료로 견적을 받아보세요!</div>
      <a href="../index.html#calc" class="btn-view" style="display:inline-block;text-decoration:none;">
        견적 신청하기 →
      </a>
    </div>`;
  }

  // ── 견적 상세 보기 ──
  window.viewQuote = function(quoteId) {
    window.location.href = `quotes.html?quoteId=${quoteId}`;
  };

  // ── 탭 전환 ──
  window.switchTab = function(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  };

  // ── 정보 저장 ──
  window.saveInfo = async function() {
    if (!currentUser) return;
    const name  = document.getElementById('editName').value.trim();
    const phone = document.getElementById('editPhone').value.trim().replace(/-/g,'');
    if (!name) { alert('이름을 입력해주세요.'); return; }
    try {
      await db.collection('users').doc(currentUser.uid).update({ name, phone });
      await currentUser.updateProfile({ displayName: name });
      alert('✅ 정보가 저장됐어요!');
      document.getElementById('profileName').textContent = `${name}님`;
    } catch(e) {
      alert('저장 중 오류가 발생했어요.');
    }
  };

  // ── 로그아웃 ──
  window.handleLogout = async function() {
    await auth.signOut();
    window.location.href = '../index.html';
  };
</script>

</body>
</html>
