<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D4A38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="골든시니어스">
  <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
  <title>받은 견적 비교 | 골든 시니어스</title>
  <style>
    :root {
      --teal: #0D4A38; --teal-dark: #083328; --teal-light: #E8F4F0; --teal-pale: #F2FAF7;
      --gold: #C4973A; --gold-light: #FDF6E7; --gold-dark: #A07830;
      --navy: #0D4A38; --navy-light: #1A6B52; --white: #FFFFFF;
      --gray-100: #F8F9FA; --gray-200: #E9ECEF; --gray-400: #9CA3AF;
      --gray-600: #6B7280; --gray-900: #1F2937;
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900);
      padding-top: 64px;
    }

    /* ===== 헤더 ===== */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: var(--teal-dark); box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      height: 64px; display: flex; align-items: center; padding: 0 24px; gap: 16px;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.15); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: white;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: white; text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-count {
      margin-left: auto; background: var(--gold-light);
      color: var(--gold-dark); font-size: 13px; font-weight: 800;
      padding: 6px 14px; border-radius: 100px;
    }

    /* ===== 메인 ===== */
    main { padding-top: 0; }
    .container { max-width: 720px; margin: 0 auto; padding: 28px 20px 80px; }

    /* 신청 조건 요약 */
    .request-summary {
      background: var(--navy); color: var(--white);
      border-radius: 20px; padding: 20px 24px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .request-summary h3 { font-size: 14px; font-weight: 800; margin-bottom: 8px; color: rgba(255,255,255,0.7); }
    .request-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .request-tag {
      background: rgba(255,255,255,0.15); color: var(--white);
      font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 100px;
    }
    .request-edit {
      margin-left: auto; background: rgba(255,255,255,0.2); color: var(--white);
      border: none; border-radius: 10px; padding: 8px 16px;
      font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none;
      transition: background 0.2s; white-space: nowrap;
    }
    .request-edit:hover { background: rgba(255,255,255,0.3); }

    /* 필터/정렬 */
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 18px; border-radius: 100px; font-size: 13px; font-weight: 700;
      border: 2px solid var(--gray-200); background: var(--white);
      cursor: pointer; transition: all 0.2s; color: var(--gray-600);
    }
    .filter-btn.active { border-color: var(--teal); background: var(--teal); color: var(--white); }
    .filter-btn:hover:not(.active) { border-color: var(--teal); color: var(--teal); }

    /* 견적 카드 */
    .quote-list { display: flex; flex-direction: column; gap: 16px; }
    .quote-card {
      background: var(--white); border-radius: 20px;
      box-shadow: var(--shadow-md); overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }
    .quote-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .quote-card.best { border-color: var(--gold); }

    /* 카드 상단 */
    .quote-top { display: flex; gap: 16px; padding: 22px 22px 16px; align-items: flex-start; }
    .q-avatar {
      width: 64px; height: 64px; border-radius: 16px; flex-shrink: 0;
      background: linear-gradient(135deg, #FFE09A, #F5A623);
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    .q-avatar.silver { background: linear-gradient(135deg, #E8E8E8, #C0C0C0); }
    .q-avatar.bronze { background: linear-gradient(135deg, #FFE0C0, #CD7F32); }
    .q-info { flex: 1; }
    .q-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .q-name { font-size: 18px; font-weight: 900; color: var(--navy); }
    .q-license {
      background: var(--teal-light); color: var(--teal);
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px;
    }
    .q-spec { font-size: 13px; color: var(--gray-600); margin-bottom: 10px; }
    .q-stats { display: flex; gap: 14px; flex-wrap: wrap; }
    .q-stat { font-size: 13px; color: var(--gray-600); }
    .q-stat strong { color: var(--navy); font-weight: 800; }
    .q-star { color: var(--gold); font-weight: 800; }

    /* 카드 가격 영역 */
    .quote-price { padding: 0 22px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .price-main { font-size: 26px; font-weight: 900; color: var(--navy); white-space: nowrap; }
    .price-unit { font-size: 13px; color: var(--gray-600); white-space: nowrap; }
    .price-badges { display: flex; gap: 6px; margin-left: auto; flex-wrap: nowrap; }
    .price-badge { padding: 4px 10px; border-radius: 100px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .price-badge.lowest  { background: #EAF8EF; color: #27AE60; }
    .price-badge.popular { background: var(--gold-light); color: var(--gold-dark); }

    /* 선생님 메시지 */
    .quote-msg {
      margin: 0 22px 16px; background: var(--gray-100); border-radius: 14px;
      padding: 14px 16px; font-size: 13px; color: var(--gray-900); line-height: 1.7;
      border-left: 3px solid var(--gold);
    }

    /* 신뢰 배지 */
    .trust-badges { padding: 0 22px 16px; display: flex; gap: 7px; flex-wrap: wrap; }
    .trust-badge {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
    }
    .trust-badge.cert { background: var(--teal-light); color: var(--teal); }
    .trust-badge.safe { background: #EAF8EF; color: #27AE60; }
    .trust-badge.ins  { background: #FFF3DC; color: var(--gold-dark); }

    /* 카드 버튼 영역 */
    .quote-actions { padding: 16px 22px; border-top: 1px solid var(--gray-100); display: flex; gap: 10px; }
    .btn-select {
      flex: 1; padding: 14px; background: var(--navy); color: var(--white);
      border: none; border-radius: 12px; font-size: 15px; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-select:hover { background: var(--navy-light); }
    .btn-select.gold-btn { background: var(--gold); }
    .btn-select.gold-btn:hover { background: var(--gold-dark); }

    /* 베스트 배너 */
    .best-banner {
      background: var(--gold); color: var(--white);
      padding: 8px 22px; font-size: 12px; font-weight: 800;
      display: flex; align-items: center; gap: 6px;
    }

    /* 빈 상태 */
    .empty-card {
      background: var(--white); border-radius: 20px;
      padding: 60px 24px; text-align: center; box-shadow: var(--shadow-md);
    }
    .empty-icon { font-size: 56px; margin-bottom: 20px; }
    .empty-title { font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .empty-sub { font-size: 14px; color: var(--gray-600); line-height: 1.7; margin-bottom: 24px; }
    .btn-back {
      display: inline-block; padding: 14px 32px;
      background: var(--navy); color: var(--white);
      border-radius: 14px; font-size: 15px; font-weight: 800;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-back:hover { background: var(--navy-light); }

    /* 확정 모달 */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 9000;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 24px;
      padding: 36px 28px; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes modalPop {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .modal-icon { font-size: 52px; text-align: center; margin-bottom: 20px; }
    .modal-title { font-size: 22px; font-weight: 900; color: var(--navy); margin-bottom: 10px; text-align: center; }
    .modal-sub { font-size: 14px; color: var(--gray-600); line-height: 1.7; text-align: center; margin-bottom: 28px; }
    .modal-teacher {
      background: var(--gold-light); border-radius: 14px;
      padding: 16px 20px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 14px;
    }
    .modal-avatar {
      width: 48px; height: 48px; border-radius: 12px; font-size: 24px;
      background: linear-gradient(135deg, #FFE09A, #F5A623);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-teacher-name { font-size: 16px; font-weight: 900; color: var(--navy); }
    .modal-teacher-info { font-size: 13px; color: var(--gray-600); }
    .modal-btn-row { display: flex; gap: 10px; }
    .modal-confirm {
      flex: 1; padding: 15px; background: var(--gold); color: var(--white);
      border: none; border-radius: 12px; font-size: 15px; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
    }
    .modal-confirm:hover { background: var(--gold-dark); }
    .modal-cancel {
      padding: 15px 20px; background: var(--gray-100); color: var(--gray-600);
      border: none; border-radius: 12px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }
    .modal-cancel:hover { background: var(--gray-200); }

    /* 만료 타이머 배너 */
    .timer-banner {
      background: linear-gradient(90deg, var(--teal-dark), var(--teal));
      color: var(--white); padding: 10px 20px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 14px; font-weight: 700; flex-wrap: wrap; text-align: center;
    }
    .timer-clock {
      background: rgba(255,255,255,0.15); border-radius: 8px;
      padding: 4px 12px; font-size: 16px; font-weight: 900;
      font-variant-numeric: tabular-nums; letter-spacing: 1px;
      color: #FFE07A; min-width: 90px; text-align: center;
    }
    .timer-urgent { color: #FF6B6B; }

    /* 로딩 */
    .loading-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid var(--gray-200); border-top-color: var(--navy);
      border-radius: 50%; animation: spin 0.8s linear infinite; border-top-color: var(--teal);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 모바일 */
    @media (max-width: 500px) {
      .quote-top { padding: 18px 16px 12px; gap: 12px; }
      .quote-price { padding: 0 16px 12px; }
      .quote-msg { margin: 0 16px 14px; }
      .quote-actions { padding: 14px 16px; }
      .q-avatar { width: 52px; height: 52px; font-size: 24px; }
      .q-name { font-size: 16px; }
      .request-summary { padding: 16px; }
      .timer-banner { font-size: 13px; gap: 8px; }
    }
  </style>
</head>
<body>

<header>
  <a href="javascript:history.back()" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a href="../index.html" class="logo">
    <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h3l2-7 4 14 3-9 2 5h4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    골든 시니어스
  </a>
  <div class="header-count" id="headerCount">📨 불러오는 중...</div>
</header>

<!-- 견적 만료 타이머 배너 -->
<div class="timer-banner" id="timerBanner">
  ⏰ 받은 견적 만료까지
  <span class="timer-clock" id="timerDisplay">23:59:59</span>
  남았습니다 · 지금 선택하면 <strong>이번 주 바로 시작</strong> 가능
</div>

<main>
  <div class="container">

    <!-- 신청 조건 요약 -->
    <div class="request-summary">
      <div style="flex:1">
        <h3>내 신청 조건</h3>
        <div class="request-tags" id="requestTags">
          <span class="request-tag">불러오는 중...</span>
        </div>
      </div>
      <a href="mypage.html" class="request-edit">← 마이페이지</a>
    </div>

    <!-- 필터 -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter(this,'all')">전체</button>
      <button class="filter-btn" onclick="setFilter(this,'price')">💰 낮은 가격순</button>
      <button class="filter-btn" onclick="setFilter(this,'career')">🏅 경력순</button>
    </div>

    <!-- 로딩 -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      선생님 견적을 불러오는 중...
    </div>

    <!-- 견적 목록 -->
    <div class="quote-list" id="quoteList" style="display:none;"></div>

  </div>
</main>

<!-- 선택 확인 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-icon">🔓</div>
    <h2 class="modal-title">선택하면 프로필이 공개돼요</h2>
    <p class="modal-sub">확정 후 선생님의 상세 프로필·경력·후기를<br>확인하고 일정을 조율할 수 있어요.</p>
    <div class="modal-teacher">
      <div class="modal-avatar" id="modalAvatar">👨‍⚕️</div>
      <div>
        <div class="modal-teacher-name" id="modalName">선생님</div>
        <div class="modal-teacher-info" id="modalPrice">1회 방문</div>
      </div>
    </div>
    <div class="modal-btn-row">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-confirm" onclick="confirmSelect()">🔓 확정하고 프로필 보기</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  });
  const auth = firebase.auth();
  const db   = firebase.firestore();

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  const params  = new URLSearchParams(location.search);
  const quoteId = params.get('quoteId') || '';

  // 선택된 선생님 정보 (모달용)
  let selectedTeacherUid  = '';
  let selectedTeacherName = '';
  let selectedPrice       = '';
  let quoteData           = null;

  // ── 타이머 ──
  (function() {
    const KEY = 'quoteExpiry_' + quoteId;
    let expiry = sessionStorage.getItem(KEY);
    if (!expiry) {
      expiry = Date.now() + 24 * 60 * 60 * 1000;
      sessionStorage.setItem(KEY, expiry);
    }
    function tick() {
      const left = parseInt(expiry) - Date.now();
      const el   = document.getElementById('timerDisplay');
      if (left <= 0) { el.textContent = '만료됨'; el.classList.add('timer-urgent'); return; }
      const h = String(Math.floor(left / 3600000)).padStart(2,'0');
      const m = String(Math.floor((left % 3600000) / 60000)).padStart(2,'0');
      const s = String(Math.floor((left % 60000) / 1000)).padStart(2,'0');
      el.textContent = `${h}:${m}:${s}`;
      if (left < 3 * 3600000) el.classList.add('timer-urgent');
      setTimeout(tick, 1000);
    }
    tick();
  })();

  // ── 인증 확인 후 데이터 로드 ──
  auth.onAuthStateChanged(async user => {
    if (!user) { location.href = 'login.html'; return; }
    if (!quoteId) { showEmpty('견적 정보가 없어요', '마이페이지에서 다시 접근해주세요.'); return; }
    await loadData(quoteId);
  });

  async function loadData(qId) {
    try {
      // 1. 고객 견적 조회
      const qSnap = await db.collection('quotes').doc(qId).get();
      if (qSnap.exists) {
        quoteData = qSnap.data();
        renderRequestSummary(quoteData);
      }

      // 2. 선생님 견적 조회 (teacher_quotes) — orderBy 없이 조회 후 JS에서 정렬
      const tqSnap = await db.collection('teacher_quotes')
        .where('quoteId', '==', qId)
        .get();

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('quoteList').style.display = 'flex';

      if (tqSnap.empty) {
        showEmpty('아직 도착한 견적이 없어요',
          '선생님들이 견적을 검토 중이에요.<br>보통 수 시간~하루 이내에 견적이 도착해요. 😊');
        return;
      }

      // 3. JS에서 최신순 정렬 + teacherUid 정규화 (teacherId 폴백)
      const teacherQuotes = tqSnap.docs
        .map(d => {
          const data = d.data();
          return {
            id: d.id,
            ...data,
            teacherUid: data.teacherUid || data.teacherId || '',  // 필드명 통일
          };
        })
        .sort((a, b) => {
          const ta = a.createdAt?.toMillis?.() || 0;
          const tb = b.createdAt?.toMillis?.() || 0;
          return tb - ta;
        });
      const teacherUids = [...new Set(teacherQuotes.map(tq => tq.teacherUid).filter(Boolean))];
      const teacherSnaps = await Promise.all(
        teacherUids.map(uid => db.collection('users').doc(uid).get())
      );
      const teacherMap = {};
      teacherSnaps.forEach(s => { if (s.exists) teacherMap[s.id] = s.data(); });

      // 4. 카드 렌더링
      document.getElementById('headerCount').textContent = `📨 견적 ${teacherQuotes.length}개 도착`;
      document.querySelector('.filter-btn.active').textContent = `전체 (${teacherQuotes.length})`;

      // 가격 최저가 계산
      const prices = teacherQuotes.map(tq => parsePrice(tq.price)).filter(p => p > 0);
      const minPrice = prices.length ? Math.min(...prices) : 0;

      teacherQuotes.forEach((tq, idx) => {
        const teacher = teacherMap[tq.teacherUid] || {};
        const isBest  = idx === 0; // 첫 번째가 추천 (최신순)
        const price   = parsePrice(tq.price);
        const isLowest = price > 0 && price === minPrice && prices.filter(p=>p===minPrice).length === 1;
        renderCard(tq, teacher, isBest, isLowest, idx);
      });

    } catch(e) {
      console.error('견적 로드 오류:', e);
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('quoteList').style.display = 'flex';
      showEmpty('견적을 불러오지 못했어요', '잠시 후 다시 시도해주세요.');
    }
  }

  function parsePrice(str) {
    if (!str) return 0;
    return parseInt(String(str).replace(/[^0-9]/g, ''), 10) || 0;
  }

  function renderRequestSummary(q) {
    const tags = [
      q.condition, q.region,
      q.budget ? q.budget + '원' : null,
      q.frequency
    ].filter(Boolean);
    const html = tags.map(t => `<span class="request-tag">${escapeHtml(t)}</span>`).join('');
    document.getElementById('requestTags').innerHTML = html || '<span class="request-tag">조건 없음</span>';
  }

  function renderCard(tq, teacher, isBest, isLowest, idx) {
    const name     = teacher.name || tq.teacherName || '선생님';
    const license  = teacher.license || teacher.specialty || '재활운동전문가';
    const spec     = (teacher.specialties || []).join(' · ') || teacher.bio?.substring(0,30) || '';
    const exp      = teacher.experience ? teacher.experience + '년' : '';
    const msg      = tq.message || tq.intro || teacher.intro || '';
    const priceNum = parsePrice(tq.price);
    const priceStr = priceNum ? priceNum.toLocaleString() + '원' : tq.price || '협의';
    const avatarIdx= idx % 3;
    const avatarCls= avatarIdx === 0 ? '' : avatarIdx === 1 ? 'silver' : 'bronze';
    const avatarEmoji = teacher.role === 'teacher' ? '👨‍⚕️' : '🧑‍⚕️';

    const list = document.getElementById('quoteList');
    const card = document.createElement('div');
    card.className = 'quote-card' + (isBest ? ' best' : '');
    card.dataset.price  = priceNum || 99999;
    card.dataset.career = parseInt(teacher.experience) || 0;

    card.innerHTML = `
      ${isBest ? `<div class="best-banner">🏆 골든 시니어스 추천 · 최신 견적</div>` : ''}
      <div class="quote-top">
        <div class="q-avatar ${avatarCls}">${avatarEmoji}</div>
        <div class="q-info">
          <div class="q-name-row">
            <span class="q-name">${escapeHtml(name)} 선생님</span>
            ${license ? `<span class="q-license">${escapeHtml(license)}</span>` : ''}
          </div>
          ${spec ? `<div class="q-spec">${escapeHtml(spec)}</div>` : ''}
          <div class="q-stats">
            ${exp ? `<div class="q-stat">경력 <strong>${escapeHtml(exp)}</strong></div>` : ''}
            ${teacher.visitCount ? `<div class="q-stat">방문 <strong>${escapeHtml(teacher.visitCount)}회</strong></div>` : ''}
            ${teacher.rebookRate ? `<div class="q-stat">재예약 <strong>${escapeHtml(teacher.rebookRate)}%</strong></div>` : ''}
          </div>
        </div>
      </div>
      <div class="trust-badges">
        ${license ? `<span class="trust-badge cert">📜 ${escapeHtml(license)}</span>` : ''}
        ${teacher.verified ? `<span class="trust-badge safe">✅ 신원인증</span>` : ''}
        ${teacher.hasInsurance ? `<span class="trust-badge ins">🛡️ 배상보험 가입</span>` : ''}
      </div>
      <div class="quote-price">
        <span class="price-main">${escapeHtml(priceStr)}</span>
        <span class="price-unit">/ 1회 방문</span>
        ${isLowest ? `<span class="price-badge lowest">💚 최저가</span>` : ''}
        ${isBest ? `<span class="price-badge popular">🔥 추천</span>` : ''}
      </div>
      ${msg ? `<div class="quote-msg">"${escapeHtml(msg)}"</div>` : ''}
      <div class="quote-actions">
        <button class="btn-select ${isBest ? 'gold-btn' : ''}"
          data-teacher-uid="${escapeHtml(tq.teacherUid)}" data-name="${escapeHtml(name)}" data-price="${escapeHtml(priceStr)}" data-avatar="${escapeHtml(avatarEmoji)}"
          onclick="openModal(this.dataset.teacherUid, this.dataset.name, this.dataset.price, this.dataset.avatar)">
          🔓 선택하면 프로필 공개
        </button>
      </div>
    `;
    list.appendChild(card);
  }

  function showEmpty(title, sub) {
    const list = document.getElementById('quoteList');
    list.style.display = 'flex';
    list.innerHTML = `
      <div class="empty-card">
        <div class="empty-icon">📭</div>
        <div class="empty-title">${title}</div>
        <div class="empty-sub">${sub}</div>
        <a href="mypage.html" class="btn-back">← 마이페이지로</a>
      </div>`;
  }

  // ── 필터 ──
  function setFilter(btn, type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cards = Array.from(document.querySelectorAll('.quote-card'));
    const list  = document.getElementById('quoteList');
    cards.sort((a, b) => {
      if (type === 'price')  return parseInt(a.dataset.price)  - parseInt(b.dataset.price);
      if (type === 'career') return parseInt(b.dataset.career) - parseInt(a.dataset.career);
      return 0;
    });
    cards.forEach(c => list.appendChild(c));
  }

  // ── 모달 ──
  function openModal(teacherUid, name, price, avatar) {
    selectedTeacherUid  = teacherUid;
    selectedTeacherName = name;
    selectedPrice       = price;
    document.getElementById('modalName').textContent  = name + ' 선생님';
    document.getElementById('modalPrice').textContent = '1회 ' + price;
    document.getElementById('modalAvatar').textContent = avatar;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }
  function closeModalOutside(e) {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  }

  async function confirmSelect() {
    closeModal();
    if (!selectedTeacherUid) {
      alert('선생님 정보를 찾을 수 없어요. 다시 시도해주세요.');
      return;
    }

    try {
      // 견적 상태를 'matched'로 업데이트
      if (quoteId) {
        await db.collection('quotes').doc(quoteId).update({
          status:           'matched',
          matchedTeacherUid:  selectedTeacherUid,
          matchedTeacherName: selectedTeacherName,
          matchedAt:          firebase.firestore.FieldValue.serverTimestamp(),
        });
        // 선택된 teacher_quote의 status를 'won'으로
        const tqSnap = await db.collection('teacher_quotes')
          .where('quoteId', '==', quoteId)
          .where('teacherUid', '==', selectedTeacherUid)
          .limit(1).get();
        if (!tqSnap.empty) {
          await tqSnap.docs[0].ref.update({ status: 'won' });
        }
      }
    } catch(e) {
      console.warn('상태 업데이트 실패 (계속 진행):', e);
    }

    // 선생님 프로필 페이지로 이동
    location.href = `teacher.html?uid=${selectedTeacherUid}&from=selected&quoteId=${quoteId}`;
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
