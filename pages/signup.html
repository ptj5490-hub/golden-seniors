<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | 골든 시니어스</title>
  <style>
    :root {
      --gold: #F5A623; --gold-light: #FFF8EC; --gold-dark: #D4891A;
      --navy: #1A2B4A; --navy-light: #2C3E6B;
      --green: #2ECC71; --red: #E74C3C;
      --gray-100: #F7F8FA; --gray-200: #EEEFF2; --gray-300: #D1D5DB;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --white: #FFFFFF;
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--white); border-bottom: 1px solid var(--gray-200);
      height: 64px; display: flex; align-items: center; padding: 0 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: var(--navy); text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }

    /* ─── PROGRESS ─── */
    .progress-bar {
      height: 3px; background: var(--gray-200); position: relative;
    }
    .progress-fill {
      height: 100%; background: var(--gold);
      transition: width 0.4s ease; width: 50%;
    }

    /* ─── MAIN ─── */
    main {
      flex: 1; display: flex; align-items: flex-start; justify-content: center;
      padding: 40px 20px 60px;
    }
    .auth-card {
      background: var(--white); border-radius: 24px;
      padding: 48px 40px; width: 100%; max-width: 480px;
      box-shadow: var(--shadow-lg);
    }

    .auth-icon { font-size: 48px; text-align: center; margin-bottom: 8px; }
    .auth-title { font-size: 24px; font-weight: 900; color: var(--navy); text-align: center; margin-bottom: 6px; }
    .auth-sub   { font-size: 14px; color: var(--gray-400); text-align: center; margin-bottom: 32px; }

    /* ─── FIELD ─── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 13px; font-weight: 700;
      color: var(--gray-600); margin-bottom: 7px;
    }
    .field input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--gray-200); border-radius: 12px;
      font-size: 15px; color: var(--gray-900);
      background: var(--gray-100); outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .field input:focus { border-color: var(--navy); background: var(--white); }
    .field input.error { border-color: var(--red); }
    .field-hint { font-size: 11px; color: var(--gray-400); margin-top: 5px; }
    .field-hint.success { color: var(--green); }
    .field-hint.danger  { color: var(--red); }

    /* ─── PASSWORD STRENGTH ─── */
    .pw-strength { display: flex; gap: 4px; margin-top: 8px; }
    .pw-strength-bar {
      flex: 1; height: 4px; border-radius: 2px;
      background: var(--gray-200); transition: background 0.3s;
    }
    .pw-strength-bar.weak   { background: var(--red); }
    .pw-strength-bar.medium { background: var(--gold); }
    .pw-strength-bar.strong { background: var(--green); }
    .pw-strength-label { font-size: 11px; margin-top: 4px; }

    /* ─── ERROR MSG ─── */
    .error-msg {
      display: none; background: #FEF2F2; border: 1px solid #FCA5A5;
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: var(--red); font-weight: 600;
      margin-bottom: 18px; text-align: center;
    }
    .error-msg.show { display: block; }

    /* ─── TERMS ─── */
    .terms-box {
      background: var(--gray-100); border-radius: 12px;
      padding: 16px; margin-bottom: 20px;
    }
    .terms-all {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 800; color: var(--navy);
      cursor: pointer; margin-bottom: 12px;
    }
    .terms-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--gray-600);
      cursor: pointer; margin-bottom: 8px;
    }
    .terms-item:last-child { margin-bottom: 0; }
    .terms-item a { color: var(--navy); font-weight: 600; text-decoration: underline; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--navy); cursor: pointer; }

    /* ─── SUBMIT ─── */
    .btn-submit {
      width: 100%; padding: 16px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { background: var(--navy-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .login-link { text-align: center; font-size: 14px; color: var(--gray-600); margin-top: 20px; }
    .login-link a { color: var(--navy); font-weight: 700; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    /* ─── SPINNER ─── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SECTION DIVIDER ─── */
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--gray-400);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin: 24px 0 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--gray-200);
    }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html" class="logo">
    <div class="logo-icon">🏃</div>
    골든 시니어스
  </a>
</header>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<main>
  <div class="auth-card">
    <div class="auth-icon">🌟</div>
    <h1 class="auth-title">골든 시니어스 가입하기</h1>
    <p class="auth-sub">어르신의 건강한 일상을 위한 첫 걸음</p>

    <div class="error-msg" id="errorMsg"></div>

    <form id="signupForm" onsubmit="handleSignup(event)">

      <!-- 기본 정보 -->
      <div class="section-label">기본 정보</div>

      <div class="field">
        <label for="name">이름 (보호자 성함) *</label>
        <input type="text" id="name" placeholder="홍길동" required autocomplete="name">
      </div>

      <div class="field">
        <label for="phone">휴대폰 번호 *</label>
        <input type="tel" id="phone" placeholder="010-0000-0000" required autocomplete="tel">
        <div class="field-hint">견적 매칭 및 일정 알림에 사용돼요</div>
      </div>

      <!-- 계정 정보 -->
      <div class="section-label">계정 정보</div>

      <div class="field">
        <label for="email">이메일 *</label>
        <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
      </div>

      <div class="field">
        <label for="password">비밀번호 *</label>
        <input type="password" id="password" placeholder="6자리 이상 입력" required minlength="6"
               autocomplete="new-password" oninput="checkPasswordStrength(this.value)">
        <div class="pw-strength">
          <div class="pw-strength-bar" id="pb1"></div>
          <div class="pw-strength-bar" id="pb2"></div>
          <div class="pw-strength-bar" id="pb3"></div>
        </div>
        <div class="field-hint pw-strength-label" id="pwLabel">비밀번호를 입력해주세요</div>
      </div>

      <div class="field">
        <label for="passwordConfirm">비밀번호 확인 *</label>
        <input type="password" id="passwordConfirm" placeholder="비밀번호를 다시 입력해주세요"
               required autocomplete="new-password" oninput="checkPasswordMatch()">
        <div class="field-hint" id="pwMatchHint"></div>
      </div>

      <!-- 약관 동의 -->
      <div class="section-label">약관 동의</div>
      <div class="terms-box">
        <label class="terms-all">
          <input type="checkbox" id="agreeAll" onchange="toggleAll(this)">
          전체 동의
        </label>
        <label class="terms-item">
          <input type="checkbox" id="agreeService" name="terms" required>
          <span>[필수] <a href="terms.html" target="_blank">서비스 이용약관</a> 동의</span>
        </label>
        <label class="terms-item">
          <input type="checkbox" id="agreePrivacy" name="terms" required>
          <span>[필수] <a href="privacy.html" target="_blank">개인정보 처리방침</a> 동의</span>
        </label>
        <label class="terms-item">
          <input type="checkbox" id="agreeMarketing">
          <span>[선택] 마케팅 정보 수신 동의 (이벤트 및 할인 혜택)</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">🌟 회원가입 완료</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="login-link">
      이미 계정이 있으신가요? <a href="login.html">로그인 →</a>
    </div>
  </div>
</main>

<!-- Firebase compat CDN (모듈 불필요) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ── 이미 로그인된 경우 리디렉트 (가입 중엔 무시) ──
  let isSigningUp = false;
  auth.onAuthStateChanged((user) => {
    if (user && !isSigningUp) window.location.href = '../index.html';
  });

  // ── 카카오로 온 경우 자동 완성 ──
  (function prefillKakao() {
    const p = new URLSearchParams(location.search);
    if (!p.get('kakaoId')) return;

    const nameEl  = document.getElementById('name');
    const emailEl = document.getElementById('email');
    const pwEl    = document.getElementById('password');
    const pw2El   = document.getElementById('passwordConfirm');

    // 이름 자동입력
    if (nameEl) nameEl.value = p.get('kakaoName') || '';

    // 이메일 필드: 합성 이메일로 채우고 숨김
    if (emailEl) {
      emailEl.value = p.get('syntheticEmail') || '';
      emailEl.closest('.field').style.display = 'none';
    }

    // 비밀번호 자동 입력 후 숨김
    if (pwEl)  { pwEl.value  = p.get('syntheticPassword') || ''; pwEl.closest('.field').style.display='none'; }
    if (pw2El) { pw2El.value = p.get('syntheticPassword') || ''; pw2El.closest('.field').style.display='none'; }

    // 카카오 가입 배지
    const badge = document.createElement('div');
    badge.style.cssText = 'background:#FEE500;color:#3A1D00;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:16px;text-align:center;';
    badge.textContent = '💛 카카오 계정으로 가입합니다';
    document.getElementById('signupForm').prepend(badge);
  })();

  // ── 비밀번호 강도 체크 ──
  window.checkPasswordStrength = function(pw) {
    const bars  = [document.getElementById('pb1'), document.getElementById('pb2'), document.getElementById('pb3')];
    const label = document.getElementById('pwLabel');
    bars.forEach(b => b.className = 'pw-strength-bar');

    if (pw.length === 0) { label.textContent = '비밀번호를 입력해주세요'; label.className = 'field-hint pw-strength-label'; return; }

    let score = 0;
    if (pw.length >= 8)                    score++;
    if (/[A-Z]/.test(pw) || /[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw))          score++;

    if (score === 1) {
      bars[0].classList.add('weak');
      label.textContent = '약함 — 숫자나 특수문자를 추가해보세요';
      label.className = 'field-hint pw-strength-label danger';
    } else if (score === 2) {
      bars[0].classList.add('medium'); bars[1].classList.add('medium');
      label.textContent = '보통 — 조금 더 강화해보세요';
      label.className = 'field-hint pw-strength-label';
    } else {
      bars.forEach(b => b.classList.add('strong'));
      label.textContent = '강함 ✓';
      label.className = 'field-hint pw-strength-label success';
    }
  };

  // ── 비밀번호 일치 확인 ──
  window.checkPasswordMatch = function() {
    const pw  = document.getElementById('password').value;
    const pw2 = document.getElementById('passwordConfirm').value;
    const hint = document.getElementById('pwMatchHint');
    if (!pw2) { hint.textContent = ''; return; }
    if (pw === pw2) { hint.textContent = '✓ 비밀번호가 일치해요'; hint.className = 'field-hint success'; }
    else            { hint.textContent = '비밀번호가 일치하지 않아요'; hint.className = 'field-hint danger'; }
  };

  // ── 전체 동의 토글 ──
  window.toggleAll = function(el) {
    ['agreeService', 'agreePrivacy', 'agreeMarketing'].forEach(id => {
      document.getElementById(id).checked = el.checked;
    });
  };

  // ── 개별 체크 시 전체 동의 상태 업데이트 ──
  ['agreeService', 'agreePrivacy', 'agreeMarketing'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      const all = ['agreeService', 'agreePrivacy', 'agreeMarketing'].every(i => document.getElementById(i).checked);
      document.getElementById('agreeAll').checked = all;
    });
  });

  // ── 회원가입 ──
  window.handleSignup = async function(e) {
    e.preventDefault();

    const name     = document.getElementById('name').value.trim();
    const phone    = document.getElementById('phone').value.trim().replace(/-/g,'');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('passwordConfirm').value;
    const marketing = document.getElementById('agreeMarketing').checked;

    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.remove('show');

    // 유효성 검사
    if (password !== password2) {
      showError('비밀번호가 일치하지 않아요.');
      return;
    }
    if (phone.length < 10) {
      showError('휴대폰 번호를 올바르게 입력해주세요.');
      return;
    }

    // 로딩
    const btn     = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = '가입 중...';

    try {
      isSigningUp = true;

      // 1. Firebase Auth 계정 생성
      const cred = await auth.createUserWithEmailAndPassword(email, password);

      // 2. 표시 이름 설정
      await cred.user.updateProfile({ displayName: name });

      // 3. Firestore 에 사용자 문서 저장
      const kakaoId = new URLSearchParams(location.search).get('kakaoId') || null;
      await db.collection('users').doc(cred.user.uid).set({
        name,
        email,
        phone,
        role:        'customer',
        marketing,
        kakaoId,
        loginType:   kakaoId ? 'kakao' : 'email',
        createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
        quoteCount:  0,
      });

      // 4. 환영 페이지로 이동
      window.location.href = '../index.html?welcome=1';

    } catch (err) {
      isSigningUp = false;
      showError(getKoreanError(err.code));
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = '🌟 회원가입 완료';
    }
  };

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function getKoreanError(code) {
    const map = {
      'auth/email-already-in-use':    '이미 사용 중인 이메일이에요. 로그인을 시도해보세요.',
      'auth/invalid-email':            '이메일 형식이 올바르지 않아요.',
      'auth/weak-password':            '비밀번호는 6자리 이상이어야 해요.',
      'auth/network-request-failed':   '인터넷 연결을 확인해주세요.',
    };
    return map[code] || '회원가입 중 오류가 발생했어요. 다시 시도해주세요.';
  }

  // ── 진행 바 업데이트 ──
  const fields = ['name','phone','email','password','passwordConfirm'];
  fields.forEach(id => {
    document.getElementById(id).addEventListener('input', updateProgress);
  });
  function updateProgress() {
    const filled = fields.filter(id => document.getElementById(id).value.length > 0).length;
    const pct = 20 + (filled / fields.length) * 80;
    document.getElementById('progressFill').style.width = pct + '%';
  }
</script>

</body>
</html>
