<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D4A38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="골든시니어스">
  <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
  <title>결제 | 골든 시니어스</title>
  <style>
    :root {
      --teal: #0D4A38; --teal-dark: #083328; --teal-light: #E8F4F0;
      --gold: #C4973A; --gold-light: #FDF6E7; --gold-dark: #A07830;
      --gray-100: #F7F8FA; --gray-200: #EEEFF2;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --white: #FFFFFF;
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900); min-height: 100vh;
    }
    header {
      background: var(--teal-dark); height: 64px;
      display: flex; align-items: center; padding: 0 24px; gap: 16px;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: rgba(255,255,255,0.12); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: white; text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    main { max-width: 540px; margin: 0 auto; padding: 32px 20px 120px; }

    .section-card {
      background: var(--white); border-radius: 20px; padding: 24px;
      box-shadow: var(--shadow-lg); margin-bottom: 16px;
    }
    .section-title {
      font-size: 13px; font-weight: 700; color: var(--gray-400);
      margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid var(--gray-100); font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row .label { color: var(--gray-400); font-weight: 600; }
    .info-row .value { color: var(--gray-900); font-weight: 700; }

    .amount-input-wrap label {
      display: block; font-size: 13px; font-weight: 700;
      color: var(--gray-600); margin-bottom: 10px;
    }
    .amount-input-row { display: flex; align-items: center; gap: 10px; }
    .amount-input {
      flex: 1; padding: 14px 16px; border: 2px solid var(--gray-200);
      border-radius: 12px; font-size: 20px; font-weight: 800;
      color: var(--teal); text-align: right; outline: none;
      background: var(--gray-100); transition: border-color 0.2s;
    }
    .amount-input:focus { border-color: var(--teal); background: white; }
    .amount-unit { font-size: 18px; font-weight: 800; color: var(--gray-600); }
    .amount-hint { font-size: 12px; color: var(--gray-400); margin-top: 8px; }

    /* 결제위젯 렌더링 영역 */
    #payment-method { margin-bottom: 0; }
    #agreement { margin-top: 0; }

    .btn-pay-wrap {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 20px; background: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 100;
    }
    .btn-pay {
      width: 100%; max-width: 540px; margin: 0 auto; display: flex;
      padding: 18px; background: var(--teal); color: white;
      border: none; border-radius: 16px; font-size: 17px; font-weight: 900;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
      align-items: center; justify-content: center; gap: 10px;
    }
    .btn-pay:hover { background: var(--teal-dark); transform: translateY(-1px); }
    .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .loading-state {
      text-align: center; padding: 60px 20px; color: var(--gray-400);
    }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 3px solid var(--gray-200); border-top-color: var(--teal);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pay-method-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .pay-method-chip {
      padding: 10px 16px; background: var(--gray-100); border-radius: 10px;
      font-size: 13px; font-weight: 700; color: var(--gray-600);
      border: 2px solid transparent; cursor: pointer; transition: all 0.15s;
    }
    .pay-method-chip:hover { border-color: var(--teal); color: var(--teal); }
    .pay-method-chip.active { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }

    .test-mode-banner {
      display: flex; gap: 10px; align-items: flex-start;
      background: #FFF8E8; border: 1.5px solid #F0D28A;
      border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
      font-size: 13px; line-height: 1.6; color: #6B4E10;
    }
    .test-mode-banner b { display: block; margin-bottom: 2px; font-size: 14px; }

    .notice {
      font-size: 12px; color: var(--gray-400); text-align: center;
      margin-top: 12px; line-height: 1.7;
    }

    @media (max-width: 480px) {
      main { padding: 20px 16px 120px; }
      .section-card { padding: 18px 16px; border-radius: 16px; }
      .info-row { font-size: 13px; }
      .amount-input { font-size: 18px; padding: 12px 14px; }
      .btn-pay { font-size: 16px; padding: 16px; border-radius: 14px; }
    }
  </style>
</head>
<body>

<header>
  <a href="javascript:history.back()" class="back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <a href="../index.html" class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    골든 시니어스
  </a>
</header>

<main>
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    결제 정보를 불러오는 중...
  </div>

  <div id="payContent" style="display:none;">
    <div style="text-align:center;margin-bottom:20px;">
      <h1 style="font-size:22px;font-weight:900;color:var(--teal);" id="payHeading">결제하기</h1>
    </div>

    <div class="test-mode-banner">
      <span>🚧</span>
      <span>
        <b>카드 실결제 심사 준비 중이에요</b>
        지금은 실제 카드 결제가 완료되지 않을 수 있어요. 결제 대신 채팅으로 담당자에게 계좌이체 등
        다른 방법을 안내받으시거나, 도움이 필요하면 카카오채널로 문의해주세요.
      </span>
    </div>

    <!-- 결제 정보 요약 -->
    <div class="section-card">
      <div class="section-title">결제 정보</div>
      <div class="info-row">
        <span class="label">프로그램</span>
        <span class="value">골든시니어스 12주 방문 재활 프로그램</span>
      </div>
      <div class="info-row">
        <span class="label">배정 선생님</span>
        <span class="value" id="displayTeacher">-</span>
      </div>
      <div class="info-row">
        <span class="label">신청 번호</span>
        <span class="value" id="displayQuoteId" style="font-family:monospace;font-size:12px;">-</span>
      </div>
      <div class="info-row">
        <span class="label">총 프로그램 금액</span>
        <span class="value">1,680,000원 (정찰제)</span>
      </div>
    </div>

    <!-- 결제 금액 (고정 · 수정 불가) -->
    <div class="section-card amount-input-wrap">
      <label id="stageLabel">이번 결제 금액</label>
      <div style="font-size:32px;font-weight:900;color:var(--teal);margin-top:4px;" id="fixedAmountDisplay">-</div>
      <div class="amount-hint" id="stageHint">— </div>
    </div>

    <!-- 결제 수단 선택 -->
    <div class="section-card">
      <div class="section-title">💳 결제 수단 선택</div>
      <div class="pay-method-list" id="payMethodList">
        <button class="pay-method-chip active" data-method="카드" onclick="selectMethod(this)">💳 신용·체크카드</button>
        <button class="pay-method-chip" data-method="카카오페이" onclick="selectMethod(this)">🟡 카카오페이</button>
        <button class="pay-method-chip" data-method="토스페이" onclick="selectMethod(this)">📱 토스페이</button>
        <button class="pay-method-chip" data-method="계좌이체" onclick="selectMethod(this)">🏦 계좌이체</button>
      </div>
    </div>

    <p class="notice">
      결제는 토스페이먼츠를 통해 안전하게 처리돼요.<br>
      카드 · 카카오페이 · 토스페이 · 계좌이체 모두 가능해요.
    </p>
  </div>
</main>

<!-- 결제 버튼 (하단 고정) -->
<div class="btn-pay-wrap" id="payBtnWrap" style="display:none;">
  <button class="btn-pay" id="payBtn" onclick="requestPayment()">
    💳 <span id="payBtnText">결제하기</span>
  </button>
</div>

<!-- Toss Payments SDK v1 -->
<script src="https://js.tosspayments.com/v1/payment"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  });
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // 라이브 전환 시 두 곳을 함께 교체해야 한다:
  //   1) 여기 TOSS_CLIENT_KEY  : test_ck_... → live_ck_...
  //   2) Vercel 환경변수 TOSS_SECRET_KEY : test_sk_... → live_sk_... (api/confirm-payment.js가 사용)
  const TOSS_CLIENT_KEY = 'test_ck_XZYkKL4Mrj9JpGP96w6EV0zJwIEW';

  // 토스 v1 SDK가 인정하는 결제수단 값으로만 매핑한다.
  // '카카오페이'/'토스페이'는 SDK의 method 값이 아니라 토스 '카드' 결제창 안에서
  // 간편결제로 선택하는 방식이라, 칩을 눌러도 항상 유효한 값만 SDK에 넘긴다.
  const TOSS_METHOD_MAP = { '카드': '카드', '카카오페이': '카드', '토스페이': '카드', '계좌이체': '계좌이체' };

  let selectedMethod = '카드';
  window.selectMethod = function(el) {
    document.querySelectorAll('.pay-method-chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    selectedMethod = el.dataset.method;
  };

  // ── 12주 프로그램 정찰제 — 금액은 서버가 아니라 여기 고정 상수로만 결정된다 ──
  // 토스 심사 요구사항: "정해진 금액만을 결제할 수 있도록" — 사용자가 금액을 바꿀 수 없어야 함.
  // 총액 1,680,000원 = 계약금 168,000원 + 잔금 1,512,000원
  // Object.freeze로 값 변경을 막는다(콘솔에서 금액 조작 방지). 실제 위변조 방어는
  // 서버(api/confirm-payment.js)에서 금액을 대조하는 단계에서 이뤄진다.
  const STAGES = Object.freeze({
    deposit: Object.freeze({ amount: 168000,  orderName: '골든시니어스 12주 프로그램 계약금',
               label: '계약금 (총액의 10%)',
               hint: '계약금 168,000원 결제 시 프로그램이 확정됩니다. 잔금 1,512,000원은 첫 방문 전까지 결제해요.' }),
    balance: Object.freeze({ amount: 1512000, orderName: '골든시니어스 12주 프로그램 잔금',
               label: '잔금',
               hint: '계약금 168,000원을 제외한 잔금입니다. 결제 후 12주 방문 재활 프로그램이 시작돼요.' }),
  });

  const params      = new URLSearchParams(location.search);
  const quoteId     = params.get('quoteId') || '';
  const teacherUid  = params.get('teacherUid') || '';
  const teacherName = params.get('teacherName') || '배정 예정';
  const stageKey    = (params.get('stage') === 'balance') ? 'balance' : 'deposit';
  const stage       = STAGES[stageKey];

  let currentUser = null;

  if (quoteId) sessionStorage.setItem('lastQuoteId', quoteId);

  auth.onAuthStateChanged(async user => {
    if (!user) { location.href = 'login.html'; return; }
    currentUser = user;

    document.getElementById('payHeading').textContent =
      stageKey === 'deposit' ? '계약금 결제' : '잔금 결제';
    document.getElementById('displayTeacher').textContent = teacherName;
    document.getElementById('displayQuoteId').textContent = quoteId ? '#' + quoteId.substring(0,8).toUpperCase() : '-';
    document.getElementById('stageLabel').textContent = stage.label;
    document.getElementById('fixedAmountDisplay').textContent = stage.amount.toLocaleString() + '원';
    document.getElementById('stageHint').textContent = stage.hint;
    document.getElementById('payBtnText').textContent = `${stage.amount.toLocaleString()}원 결제하기`;

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('payContent').style.display   = 'block';
    document.getElementById('payBtnWrap').style.display   = 'block';
  });

  window.requestPayment = async function() {
    // 금액은 URL 파라미터(stage)로만 결정된 고정 상수. 사용자 입력값 없음.
    const amount    = stage.amount;
    const orderName = stage.orderName;
    const method    = TOSS_METHOD_MAP[selectedMethod] || '카드';

    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.querySelector('#payBtnText').textContent = '결제창 여는 중...';

    try {
      const orderId = `order-${stageKey}-${(quoteId.slice(0,8) || 'gs').replace(/[^a-zA-Z0-9]/g,'')}-${Date.now()}`;

      await db.collection('payments').doc(orderId).set({
        orderId, quoteId,
        customerUid:  currentUser.uid,
        teacherUid, teacherName,
        serviceName:  orderName,
        stage:        stageKey,
        amount,
        status:    'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });

      const tossPayments = TossPayments(TOSS_CLIENT_KEY);
      await tossPayments.requestPayment(method, {
        amount,
        orderId,
        orderName,
        customerName:  currentUser.displayName || '고객',
        customerEmail: currentUser.email || '',
        successUrl: `${location.origin}/pages/payment-success.html`,
        failUrl:    `${location.origin}/pages/payment-fail.html`,
      });

    } catch(e) {
      console.error('결제 오류:', e);
      if (e.code !== 'USER_CANCEL') {
        alert('결제 중 오류가 발생했어요: ' + (e.message || '다시 시도해주세요.'));
      }
      btn.disabled = false;
      btn.querySelector('#payBtnText').textContent = `${stage.amount.toLocaleString()}원 결제하기`;
    }
  };
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
  }
</script>
</body>
</html>
