<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 골든 시니어스</title>
  <style>
    :root {
      --teal: #0D4A38; --teal-dark: #083328; --teal-light: #E8F4F0;
      --gold: #C4973A; --gold-light: #FDF6E7; --gold-dark: #A07830;
      --navy: #0D4A38; --navy-light: #1A6B52;
      --green: #2ECC71; --red: #E74C3C;
      --gray-100: #F7F8FA; --gray-200: #EEEFF2; --gray-300: #D1D5DB;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --white: #FFFFFF;
      --shadow-md: 0 4px 24px rgba(0,0,0,0.10);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.13);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-100); color: var(--gray-900);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--teal-dark);
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      height: 64px; display: flex; align-items: center; padding: 0 24px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 900; color: white;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ─── MAIN ─── */
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--white); border-radius: 24px;
      padding: 48px 40px; width: 100%; max-width: 440px;
      box-shadow: var(--shadow-lg);
    }

    .auth-icon { font-size: 48px; text-align: center; margin-bottom: 8px; }
    .auth-title {
      font-size: 24px; font-weight: 900; color: var(--navy);
      text-align: center; margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px; color: var(--gray-400);
      text-align: center; margin-bottom: 32px;
    }

    /* ─── FORM ─── */
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 13px; font-weight: 700;
      color: var(--gray-600); margin-bottom: 7px;
    }
    .field input {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: 12px; font-size: 15px; color: var(--gray-900);
      background: var(--gray-100);
      transition: border-color 0.2s, background 0.2s;
      outline: none;
    }
    .field input:focus {
      border-color: var(--teal); background: var(--white);
    }
    .field input.error { border-color: var(--red); }

    .field-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .forgot-link { font-size: 12px; color: var(--gray-400); text-decoration: none; }
    .forgot-link:hover { color: var(--navy); }

    /* ─── SUBMIT ─── */
    .btn-submit {
      width: 100%; padding: 16px;
      background: var(--navy); color: var(--white);
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: 800; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { background: var(--navy-light); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ─── ERROR MESSAGE ─── */
    .error-msg {
      display: none; background: #FEF2F2; border: 1px solid #FCA5A5;
      border-radius: 10px; padding: 12px 14px;
      font-size: 13px; color: var(--red); font-weight: 600;
      margin-bottom: 18px; text-align: center;
    }
    .error-msg.show { display: block; }

    /* ─── DIVIDER ─── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--gray-200);
    }
    .divider span { font-size: 12px; color: var(--gray-400); font-weight: 600; white-space: nowrap; }

    /* ─── SIGNUP LINK ─── */
    .signup-link {
      text-align: center; font-size: 14px; color: var(--gray-600);
    }
    .signup-link a {
      color: var(--navy); font-weight: 700; text-decoration: none;
    }
    .signup-link a:hover { text-decoration: underline; }

    /* ─── 카카오 버튼 ─── */
    .btn-kakao {
      width: 100%; padding: 15px;
      background: #FEE500; color: #3A1D00;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: opacity 0.2s; margin-bottom: 0;
    }
    .btn-kakao:hover { opacity: 0.88; }
    .kakao-icon { width: 22px; height: 22px; }
    .or-divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0;
    }
    .or-divider::before, .or-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--gray-200);
    }
    .or-divider span { font-size: 12px; color: var(--gray-400); font-weight: 600; }

    /* ─── TEACHER LINK ─── */
    .teacher-link {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--gold-light); border: 1px solid rgba(245,166,35,0.3);
      border-radius: 14px; padding: 14px 16px;
      text-decoration: none; color: var(--navy);
      font-size: 14px; font-weight: 700;
      margin-top: 14px; transition: background 0.2s;
    }
    .teacher-link:hover { background: #FFF0D0; }
    .teacher-link span { flex: 1; line-height: 1.4; }
    .teacher-link .arrow { color: var(--gold-dark); font-size: 16px; flex-shrink: 0; }

    /* ─── LOADING SPINNER ─── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; border-radius: 20px; }
    }
  </style>
</head>
<body>

<header>
  <a href="../index.html" class="logo">
    <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 12h3l2-7 4 14 3-9 2 5h4" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    골든 시니어스
  </a>
</header>

<main>
  <div class="auth-card">
    <div class="auth-icon">👋</div>
    <h1 class="auth-title">다시 만나서 반가워요!</h1>
    <p class="auth-sub">로그인하고 맞춤 재활운동 서비스를 이용하세요</p>

    <!-- 카카오 로그인 -->
    <button class="btn-kakao" onclick="kakaoLogin()">
      <svg class="kakao-icon" viewBox="0 0 24 24" fill="#3A1D00">
        <path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.7 5.08 4.3 6.5L5.2 21l5.1-2.7c.55.07 1.12.1 1.7.1 5.523 0 10-3.477 10-7.8C22 6.477 17.523 3 12 3z"/>
      </svg>
      카카오로 1초 로그인
    </button>

    <div class="or-divider"><span>또는 이메일로 로그인</span></div>

    <div class="error-msg" id="errorMsg">이메일 또는 비밀번호를 확인해주세요.</div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="example@email.com" required autocomplete="email">
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">비밀번호</label>
          <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">비밀번호 찾기</a>
        </div>
        <input type="password" id="password" placeholder="비밀번호 입력" required autocomplete="current-password" minlength="6">
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">로그인</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>

    <div class="divider"><span>아직 회원이 아니신가요?</span></div>

    <div class="signup-link">
      <a href="signup.html">고객 회원가입 →</a>
    </div>

    <a href="signup-teacher.html" class="teacher-link">
      <span>👨‍⚕️ 재활운동사로 활동하고 싶으신가요?</span>
      <span class="arrow">›</span>
    </a>
  </div>
</main>

<!-- 카카오 SDK -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>

<!-- Firebase compat CDN (모듈 불필요) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyBJtViY764nCepskf7Wf3Wl9JqPrC1bx2o",
    authDomain:        "golden-seniors.firebaseapp.com",
    projectId:         "golden-seniors",
    storageBucket:     "golden-seniors.firebasestorage.app",
    messagingSenderId: "244026917780",
    appId:             "1:244026917780:web:2dbb4b16db8365b0a10581"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ── 이미 로그인된 경우 리디렉트 ──
  let isLoggingIn = false;
  auth.onAuthStateChanged(async (user) => {
    if (user && !isLoggingIn) {
      const snap = await db.collection('users').doc(user.uid).get();
      const role = snap.exists ? snap.data().role : 'customer';
      redirectByRole(role);
    }
  });

  function redirectByRole(role) {
    if (role === 'teacher') {
      window.location.href = 'dashboard-teacher.html';
    } else {
      window.location.href = '../index.html';
    }
  }

  // ── 로그인 ──
  window.handleLogin = async function(e) {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const spinner  = document.getElementById('spinner');
    const btnText  = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = '로그인 중...';
    errorMsg.classList.remove('show');

    try {
      isLoggingIn = true;
      const cred = await auth.signInWithEmailAndPassword(email, password);
      const snap = await db.collection('users').doc(cred.user.uid).get();
      const role = snap.exists ? snap.data().role : 'customer';
      redirectByRole(role);
    } catch (err) {
      isLoggingIn = false;
      const msg = getKoreanError(err.code);
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
      document.getElementById('email').classList.add('error');
      document.getElementById('password').classList.add('error');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = '로그인';
    }
  };

  // ── 비밀번호 찾기 ──
  window.handleForgotPassword = async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      alert('위에 이메일을 먼저 입력해주세요.');
      document.getElementById('email').focus();
      return;
    }
    try {
      await auth.sendPasswordResetEmail(email);
      alert(`📧 ${email} 으로 비밀번호 재설정 메일을 보냈어요.\n메일함을 확인해주세요.`);
    } catch (err) {
      alert('등록되지 않은 이메일이에요. 다시 확인해주세요.');
    }
  };

  // ── 에러 메시지 한국어 변환 ──
  function getKoreanError(code) {
    const map = {
      'auth/user-not-found':       '등록되지 않은 이메일이에요.',
      'auth/wrong-password':       '비밀번호가 틀렸어요.',
      'auth/invalid-email':        '이메일 형식이 올바르지 않아요.',
      'auth/too-many-requests':    '로그인 시도가 너무 많아요. 잠시 후 다시 시도해주세요.',
      'auth/user-disabled':        '비활성화된 계정이에요. 고객센터에 문의해주세요.',
      'auth/invalid-credential':   '이메일 또는 비밀번호를 확인해주세요.',
      'auth/network-request-failed': '인터넷 연결을 확인해주세요.',
    };
    return map[code] || '로그인 중 오류가 발생했어요. 다시 시도해주세요.';
  }

  // ── 입력 시 에러 스타일 초기화 ──
  ['email', 'password'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(id).classList.remove('error');
      document.getElementById('errorMsg').classList.remove('show');
    });
  });

  // ── 카카오 키 설정 ──
  const KAKAO_JS_KEY   = 'fa3e0d822344045ef8c622a230b76118';  // JavaScript 키
  const KAKAO_REST_KEY = '70012d9ea3ffd20dbf10a6feff8f5271';   // REST API 키
  const KAKAO_REDIRECT = `${location.origin}/pages/login.html`;

  try {
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
  } catch(e) {
    console.warn('카카오 SDK 초기화 실패:', e);
  }

  // ── 카카오 리다이렉트 처리 (?code= 파라미터로 돌아왔을 때) ──
  (async function handleKakaoReturn() {
    const urlParams = new URLSearchParams(location.search);
    const code = urlParams.get('code');
    if (!code) return;

    // URL 파라미터 정리 (뒤로가기 방지)
    history.replaceState(null, '', location.pathname);

    // 로딩 표시
    const kakaoBtn = document.querySelector('.btn-kakao');
    if (kakaoBtn) {
      kakaoBtn.disabled = true;
      kakaoBtn.textContent = '카카오 로그인 처리 중...';
    }

    try {
      // 1단계: authorization code → access token 교환
      const tokenRes = await fetch('https://kauth.kakao.com/oauth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=utf-8' },
        body: new URLSearchParams({
          grant_type:   'authorization_code',
          client_id:    KAKAO_REST_KEY,
          redirect_uri: KAKAO_REDIRECT,
          code:         code,
        }),
      });
      const tokenData = await tokenRes.json();

      if (tokenData.error) {
        throw new Error(`토큰 오류: ${tokenData.error_description || tokenData.error}`);
      }

      const accessToken = tokenData.access_token;
      Kakao.Auth.setAccessToken(accessToken);

      // 2단계: 사용자 정보 가져오기 (SDK v2 - Promise 방식)
      const user = await Kakao.API.request({ url: '/v2/user/me' });

      const kakaoId   = String(user.id);
      const kakaoName = user.kakao_account?.profile?.nickname
                      || user.properties?.nickname
                      || '카카오회원';
      const syntheticEmail    = `kakao_${kakaoId}@golden-seniors.internal`;
      const syntheticPassword = `kakao_${kakaoId}_gs_pw!`;

      // 3단계: Firebase 로그인 시도 (기존 계정 있으면 로그인, 없으면 회원가입)
      isLoggingIn = true;
      try {
        const cred = await auth.signInWithEmailAndPassword(syntheticEmail, syntheticPassword);
        const snap = await db.collection('users').doc(cred.user.uid).get();
        redirectByRole(snap.exists ? snap.data().role : 'customer');
      } catch (loginErr) {
        if (loginErr.code === 'auth/user-not-found' || loginErr.code === 'auth/invalid-credential') {
          // 신규 카카오 유저 → 회원가입 페이지로
          const params = new URLSearchParams({ kakaoId, kakaoName, syntheticEmail, syntheticPassword });
          location.href = `signup.html?${params.toString()}`;
        } else {
          throw loginErr;
        }
      }
    } catch(e) {
      isLoggingIn = false;
      console.error('카카오 처리 오류:', e);
      document.getElementById('errorMsg').textContent = '카카오 로그인 중 오류가 발생했어요. 다시 시도해주세요.';
      document.getElementById('errorMsg').classList.add('show');
      if (kakaoBtn) { kakaoBtn.disabled = false; kakaoBtn.innerHTML = '<svg class="kakao-icon" viewBox="0 0 24 24" fill="#3A1D00"><path d="M12 3C6.477 3 2 6.477 2 10.8c0 2.7 1.7 5.08 4.3 6.5L5.2 21l5.1-2.7c.55.07 1.12.1 1.7.1 5.523 0 10-3.477 10-7.8C22 6.477 17.523 3 12 3z"/></svg>카카오로 1초 로그인'; }
    }
  })();

  // ── 카카오 버튼 클릭 → 카카오 인증 페이지로 이동 ──
  window.kakaoLogin = function() {
    if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
      alert('카카오 SDK 로딩 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    Kakao.Auth.authorize({
      redirectUri: KAKAO_REDIRECT,
      scope: 'profile_nickname',
    });
  };
</script>

</body>
</html>
