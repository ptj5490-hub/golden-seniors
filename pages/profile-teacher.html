<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 프로필 편집 | 골든 시니어스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal:       #0D4A38; --teal-dark: #083328; --teal-mid: #1A6B52;
      --teal-light: #E8F4F0; --teal-pale: #F2FAF7;
      --gold:       #C4973A; --gold-light: #FDF6E7; --gold-dark: #A67C2A;
      --white: #FFFFFF;
      --green: #16A34A; --green-light: #DCFCE7;
      --red: #DC2626;   --red-light: #FEF2F2;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
      --gray-400: #9CA3AF; --gray-600: #4B5563; --gray-900: #111827;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.07);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
      --radius: 14px;
      /* 하위 호환 */
      --navy: var(--teal);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--teal-pale); color: var(--gray-900); min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 헤더 ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--teal-dark); height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 17px; font-weight: 900; color: var(--white); text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-icon svg { display: block; }
    .btn-back {
      display: flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600;
      text-decoration: none; padding: 8px 14px;
      background: rgba(255,255,255,0.1); border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15); transition: background 0.2s;
    }
    .btn-back svg { width: 14px; height: 14px; }
    .btn-back:hover { background: rgba(255,255,255,0.2); }

    /* ── 레이아웃 ── */
    .container {
      max-width: 800px; margin: 0 auto; padding: 32px 20px 80px;
      display: grid; grid-template-columns: 1fr 280px; gap: 20px; align-items: start;
    }

    /* ── 섹션 카드 ── */
    .section {
      background: var(--white); border-radius: var(--radius); padding: 28px;
      box-shadow: var(--shadow-sm); margin-bottom: 14px;
      border: 1.5px solid var(--gray-200);
    }
    .section-title {
      font-size: 15px; font-weight: 800; color: var(--teal);
      margin-bottom: 20px; padding-bottom: 14px;
      border-bottom: 2px solid var(--teal-light);
      display: flex; align-items: center; gap: 9px;
    }
    .section-title svg { width: 18px; height: 18px; flex-shrink: 0; }
    .s-bar { width: 3px; height: 18px; background: var(--teal); border-radius: 2px; flex-shrink: 0; }

    /* ── 아바타 선택 ── */
    .avatar-row {
      display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
    }
    .avatar-preview {
      width: 80px; height: 80px; border-radius: 18px;
      background: var(--teal-light);
      border: 3px solid var(--teal-light);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: transform 0.2s, border-color 0.2s;
      overflow: hidden;
    }
    .avatar-preview:hover { transform: scale(1.05); border-color: var(--teal); }
    .avatar-preview svg { width: 44px; height: 44px; }
    .avatar-grid {
      display: none; flex-wrap: wrap; gap: 8px;
    }
    .avatar-grid.open { display: flex; }
    .avatar-opt {
      width: 48px; height: 48px; border-radius: 12px;
      border: 2.5px solid transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s;
      font-size: 13px; font-weight: 900; color: white;
    }
    .avatar-opt:hover { transform: scale(1.1); }
    .avatar-opt.sel { border-color: var(--gray-900); transform: scale(1.1); }

    /* ── 폼 요소 ── */
    .field { margin-bottom: 18px; }
    label.field-label {
      display: block; font-size: 13px; font-weight: 700;
      color: var(--navy); margin-bottom: 6px;
    }
    label.field-label .req { color: var(--red); margin-left: 2px; }
    label.field-label .opt { color: var(--gray-400); font-weight: 400; margin-left: 4px; font-size: 12px; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--gray-200); border-radius: 12px;
      font-size: 14px; color: var(--gray-900); outline: none;
      font-family: inherit; transition: border-color 0.2s;
      background: var(--white);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--teal); background: var(--white); }
    textarea { resize: vertical; line-height: 1.7; }
    .field-hint { font-size: 12px; color: var(--gray-400); margin-top: 5px; }

    /* 2컬럼 */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* ── 전문 분야 칩 ── */
    .spec-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .spec-chip {
      padding: 8px 16px; border-radius: 20px;
      background: var(--gray-100); color: var(--gray-600);
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s; user-select: none;
    }
    .spec-chip.on { background: var(--teal); color: var(--white); border-color: var(--teal); }

    /* ── 경력 입력 (동적) ── */
    .career-entries { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .career-entry {
      background: var(--gray-100); border-radius: 14px; padding: 14px 16px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .career-entry-fields { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .career-entry input { background: var(--white); padding: 8px 12px; font-size: 13px; }
    .career-entry-del {
      width: 32px; height: 32px; border-radius: 8px; border: none;
      background: var(--red-light); color: var(--red); font-size: 16px;
      cursor: pointer; flex-shrink: 0; margin-top: 2px;
    }
    .btn-add-career {
      width: 100%; padding: 10px; border: 2px dashed var(--gray-200);
      background: none; border-radius: 12px; font-size: 13px;
      color: var(--gray-400); font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add-career:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }

    /* ── 프리뷰 카드 (오른쪽) ── */
    .preview-sticky { position: sticky; top: 84px; }
    .preview-card {
      background: var(--white); border-radius: var(--radius); padding: 24px;
      box-shadow: var(--shadow-sm); margin-bottom: 14px;
      border: 1.5px solid var(--gray-200);
    }
    .preview-title {
      font-size: 11px; font-weight: 700; color: var(--gray-400);
      margin-bottom: 14px; letter-spacing: 0.8px; text-transform: uppercase;
      display: flex; align-items: center; gap: 6px;
    }
    .preview-title svg { width: 13px; height: 13px; }
    .preview-avatar {
      width: 60px; height: 60px; border-radius: 16px;
      background: var(--teal-light); border: 2px solid var(--teal-light);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; overflow: hidden;
    }
    .preview-avatar svg { width: 34px; height: 34px; }
    .preview-name { font-size: 17px; font-weight: 900; color: var(--teal); margin-bottom: 4px; }
    .preview-spec { font-size: 12px; color: var(--gray-600); margin-bottom: 10px; line-height: 1.5; }
    .preview-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .preview-chip { padding: 4px 10px; background: var(--teal-light); border-radius: 20px; font-size: 11px; color: var(--teal); font-weight: 600; }
    .preview-price { font-size: 20px; font-weight: 900; color: var(--teal); margin-bottom: 4px; }
    .preview-region { font-size: 12px; color: var(--gray-400); display: flex; align-items: center; gap: 4px; }
    .preview-region svg { width: 12px; height: 12px; }
    .preview-divider { border: none; border-top: 1px solid var(--gray-200); margin: 12px 0; }
    .btn-preview-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 11px; text-align: center;
      background: var(--teal-light); border-radius: 12px; font-size: 13px; font-weight: 700;
      color: var(--teal); text-decoration: none; margin-bottom: 8px;
      transition: background 0.2s;
    }
    .btn-preview-link svg { width: 14px; height: 14px; }
    .btn-preview-link:hover { background: var(--teal); color: var(--white); }

    /* ── 저장 버튼 ── */
    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--white); border-top: 1px solid var(--gray-200);
      padding: 14px 24px;
      display: flex; gap: 10px; align-items: center; z-index: 90;
    }
    .save-status { flex: 1; font-size: 13px; color: var(--gray-400); }
    .btn-save {
      padding: 13px 32px; background: var(--gold); color: var(--white);
      border: none; border-radius: 14px; font-size: 15px; font-weight: 800;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-save:hover { background: var(--gold-dark); }
    .btn-save:disabled { background: var(--gray-200); color: var(--gray-400); cursor: not-allowed; }

    /* ── 토스트 ── */
    .toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--teal); color: var(--white);
      padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 600; z-index: 999;
      transition: transform 0.35s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      .container { grid-template-columns: 1fr; padding-bottom: 120px; }
      .preview-sticky { display: none; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <a href="dashboard-teacher.html" class="btn-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    대시보드
  </a>
  <a href="../index.html" class="logo">
    <div class="logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    골든 시니어스
  </a>
</header>

<div class="container">

  <!-- ── 왼쪽: 편집 폼 ── -->
  <div class="left-col">

    <!-- 1. 기본 정보 -->
    <div class="section">
      <div class="section-title">
        <div class="s-bar"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        기본 정보
      </div>

      <!-- 아바타 -->
      <div class="field">
        <label class="field-label">프로필 색상</label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview" onclick="toggleAvatarGrid()">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div>
            <div style="font-size:13px;color:var(--gray-600);margin-bottom:6px">아이콘을 눌러 변경하세요</div>
            <div class="avatar-grid" id="avatarGrid">
              <!-- JS로 채움 -->
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="field-label">이름 <span class="req">*</span></label>
          <input type="text" id="inputName" placeholder="홍길동">
        </div>
        <div class="field">
          <label class="field-label">연락처</label>
          <input type="text" id="inputPhone" placeholder="010-0000-0000">
        </div>
      </div>

      <div class="field">
        <label class="field-label">한 줄 소개 <span class="opt">(프로필 카드에 표시)</span></label>
        <input type="text" id="inputTagline" placeholder="예: 관절·낙상예방 전문 · 경력 8년" maxlength="40">
        <div class="field-hint">40자 이내</div>
      </div>

      <div class="field">
        <label class="field-label">상세 소개글 <span class="opt">(선생님을 직접 소개해보세요)</span></label>
        <textarea id="inputBio" rows="5" placeholder="어르신들의 건강한 일상을 되찾아드리기 위해 10년간 방문 재활운동을 해왔습니다..."></textarea>
      </div>
    </div>

    <!-- 2. 전문 분야 -->
    <div class="section">
      <div class="section-title">
        <div class="s-bar"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        전문 분야
      </div>
      <div class="field-hint" style="margin-bottom:12px">최대 5개 선택</div>
      <div class="spec-grid" id="specGrid">
        <!-- JS로 채움 -->
      </div>
    </div>

    <!-- 3. 경력 사항 -->
    <div class="section">
      <div class="section-title">
        <div class="s-bar"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        경력 사항
      </div>
      <div class="career-entries" id="careerEntries"></div>
      <button class="btn-add-career" onclick="addCareer()">+ 경력 추가</button>
    </div>

    <!-- 4. 자격증 · 학력 -->
    <div class="section">
      <div class="section-title">
        <div class="s-bar"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        자격증 · 학력
      </div>

      <div class="field">
        <label class="field-label">보유 자격증 <span class="req">*</span></label>
        <div class="career-entries" id="certEntries"></div>
        <button class="btn-add-career" onclick="addCert()">+ 자격증 추가</button>
      </div>

      <div class="field" style="margin-top:16px;">
        <label class="field-label">학력</label>
        <div class="career-entries" id="eduEntries"></div>
        <button class="btn-add-career" onclick="addEdu()">+ 학력 추가</button>
      </div>
    </div>

    <!-- 5. 서비스 정보 -->
    <div class="section">
      <div class="section-title">
        <div class="s-bar"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        서비스 정보
      </div>
      <div class="grid-2">
        <div class="field">
          <label class="field-label">1회 방문 가격 (만원)</label>
          <input type="number" id="inputPrice" placeholder="6" min="1" max="100">
          <div class="field-hint">예: 6 → "6만원~" 으로 표시</div>
        </div>
        <div class="field">
          <label class="field-label">1회 소요 시간</label>
          <select id="inputDuration">
            <option value="약 50분">약 50분</option>
            <option value="약 60분">약 60분</option>
            <option value="약 90분">약 90분</option>
            <option value="약 120분">약 120분</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">활동 지역</label>
        <input type="text" id="inputRegion" placeholder="예: 서울 강남·서초·송파">
      </div>
      <div class="field">
        <label class="field-label">방문 가능 시간</label>
        <input type="text" id="inputAvailTime" placeholder="예: 평일 09:00~18:00">
      </div>
      <div class="field">
        <label class="field-label">최소 방문 횟수</label>
        <select id="inputMinVisit">
          <option value="주 1회부터">주 1회부터</option>
          <option value="주 2회부터">주 2회부터</option>
          <option value="협의 가능">협의 가능</option>
        </select>
      </div>
    </div>

  </div><!-- /left-col -->

  <!-- ── 오른쪽: 프리뷰 ── -->
  <div class="preview-sticky">
    <div class="preview-card">
      <div class="preview-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        미리보기
      </div>
      <div class="preview-avatar" id="pvAvatar"></div>
      <div class="preview-name" id="pvName">이름</div>
      <div class="preview-spec" id="pvSpec">전문 분야</div>
      <div class="preview-chips" id="pvChips"></div>
      <hr class="preview-divider">
      <div class="preview-price" id="pvPrice">-만원~</div>
      <div class="preview-region" id="pvRegion"></div>
      <hr class="preview-divider">
      <a id="pvLink" href="#" target="_blank" class="btn-preview-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        공개 프로필 보기
      </a>
    </div>
    <div class="preview-card" style="padding:18px">
      <p style="font-size:12px;color:var(--gray-600);line-height:1.7;display:flex;align-items:flex-start;gap:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-top:1px"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
        <span><strong>저장하면 즉시 반영</strong>돼요.<br>관리자 승인 후 고객에게 프로필이 공개됩니다.</span>
      </p>
    </div>
  </div>

</div><!-- /container -->

<!-- 저장 바 -->
<div class="save-bar">
  <div class="save-status" id="saveStatus">마지막 저장: 없음</div>
  <button class="btn-save" id="saveBtn" onclick="saveProfile()">저장하기</button>
</div>

<div class="toast" id="toast"></div>

<script>
const auth = firebase.auth();
const db   = firebase.firestore();

const SPECS = ['근골격계','뇌졸중','치매예방','낙상예방','심폐기능','파킨슨','수술 후 재활','보행훈련'];
const AVATAR_COLORS = ['#0D4A38','#C4973A','#1A6B52','#16A34A','#2563EB','#7C3AED','#DC2626','#D97706','#0891B2','#374151'];
const MAX_SPEC = 5;

let selectedSpecs  = [];
let careerCount    = 0;
let currentUid     = null;
let selectedAvatar = '#0D4A38';

const PERSON_SVG = (size, stroke='white') =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="${size}" height="${size}"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

/* ── 초기화 ── */
auth.onAuthStateChanged(async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  const snap = await db.collection('users').doc(user.uid).get();
  if (!snap.exists || snap.data().role !== 'teacher') { location.href = '../index.html'; return; }
  currentUid = user.uid;
  buildAvatarGrid();
  buildSpecGrid();
  loadProfile(snap.data());
  document.getElementById('pvLink').href = `teacher.html?uid=${user.uid}`;
});

/* ── 아바타 그리드 ── */
function buildAvatarGrid() {
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = AVATAR_COLORS.map(c =>
    `<div class="avatar-opt" data-color="${c}" style="background:${c}" onclick="selectAvatar('${c}')">${PERSON_SVG(22)}</div>`
  ).join('');
}
function toggleAvatarGrid() {
  document.getElementById('avatarGrid').classList.toggle('open');
}
function selectAvatar(c) {
  selectedAvatar = c;
  const prev = document.getElementById('avatarPreview');
  prev.style.background = c;
  prev.innerHTML = PERSON_SVG(44);
  const pv = document.getElementById('pvAvatar');
  pv.style.background = c;
  pv.innerHTML = PERSON_SVG(34);
  document.getElementById('avatarGrid').querySelectorAll('.avatar-opt').forEach(el => {
    el.classList.toggle('sel', el.dataset.color === c);
  });
  document.getElementById('avatarGrid').classList.remove('open');
}

/* ── 전문 분야 칩 ── */
function buildSpecGrid() {
  document.getElementById('specGrid').innerHTML = SPECS.map(s =>
    `<div class="spec-chip" id="chip_${s}" onclick="toggleSpec('${s}')">${s}</div>`
  ).join('');
}
function toggleSpec(s) {
  if (selectedSpecs.includes(s)) {
    selectedSpecs = selectedSpecs.filter(x => x !== s);
    document.getElementById('chip_' + s).classList.remove('on');
  } else {
    if (selectedSpecs.length >= MAX_SPEC) { showToast(`최대 ${MAX_SPEC}개까지 선택할 수 있어요`); return; }
    selectedSpecs.push(s);
    document.getElementById('chip_' + s).classList.add('on');
  }
  updatePreview();
}

/* ── 경력 추가 ── */
function addCareer(data = {}) {
  careerCount++;
  const id = 'career_' + careerCount;
  const div = document.createElement('div');
  div.className = 'career-entry';
  div.id = id;
  div.innerHTML = `
    <div class="career-entry-fields">
      <input type="text" placeholder="기간 (예: 2020 – 현재)" value="${esc(data.period || '')}">
      <input type="text" placeholder="직책 · 기관명" value="${esc(data.title || '')}">
      <input type="text" placeholder="상세 업무 (선택)" value="${esc(data.desc || '')}">
    </div>
    <button class="career-entry-del" onclick="document.getElementById('${id}').remove()">×</button>
  `;
  document.getElementById('careerEntries').appendChild(div);
}

/* ── 자격증 추가 ── */
let certCount = 0;
function addCert(data = {}) {
  certCount++;
  const id = 'cert_' + certCount;
  const div = document.createElement('div');
  div.className = 'career-entry';
  div.id = id;
  div.innerHTML = `
    <div class="career-entry-fields">
      <input type="text" placeholder="자격증명 (예: 물리치료사)" value="${esc(data.name || '')}">
      <input type="text" placeholder="발급기관 · 취득연도 (예: 보건복지부 · 2018)" value="${esc(data.detail || '')}">
    </div>
    <button class="career-entry-del" onclick="document.getElementById('${id}').remove()">×</button>
  `;
  document.getElementById('certEntries').appendChild(div);
}

/* ── 학력 추가 ── */
let eduCount = 0;
function addEdu(data = {}) {
  eduCount++;
  const id = 'edu_' + eduCount;
  const div = document.createElement('div');
  div.className = 'career-entry';
  div.id = id;
  div.innerHTML = `
    <div class="career-entry-fields">
      <input type="text" placeholder="학교명 (예: 한국체육대학교)" value="${esc(data.school || '')}">
      <input type="text" placeholder="학과 · 졸업연도 (예: 스포츠재활학과 · 2016)" value="${esc(data.detail || '')}">
    </div>
    <button class="career-entry-del" onclick="document.getElementById('${id}').remove()">×</button>
  `;
  document.getElementById('eduEntries').appendChild(div);
}

/* ── 프로필 로드 ── */
function loadProfile(d) {
  selectAvatar(d.avatar || '#0D4A38');
  document.getElementById('inputName').value     = d.name     || '';
  document.getElementById('inputPhone').value    = d.phone    || '';
  document.getElementById('inputTagline').value  = d.tagline  || '';
  document.getElementById('inputBio').value      = d.bio      || '';
  // 자격증
  const certList = Array.isArray(d.certifications) ? d.certifications : [];
  if (certList.length) certList.forEach(c => addCert(c)); else addCert();

  // 학력
  const eduList = Array.isArray(d.education) ? d.education : [];
  if (eduList.length) eduList.forEach(e => addEdu(e)); else addEdu();
  document.getElementById('inputPrice').value    = d.price     || '';
  document.getElementById('inputRegion').value   = d.region    || '';
  document.getElementById('inputAvailTime').value = d.availTime || '';

  if (d.duration) document.getElementById('inputDuration').value  = d.duration;
  if (d.minVisit) document.getElementById('inputMinVisit').value  = d.minVisit;

  // 전문 분야
  (d.specialties || []).forEach(s => {
    if (SPECS.includes(s)) { selectedSpecs.push(s); document.getElementById('chip_' + s).classList.add('on'); }
  });

  // 경력
  if (d.careerList && d.careerList.length > 0) {
    d.careerList.forEach(c => addCareer(c));
  } else {
    addCareer(); // 빈 폼 1개
  }

  // 저장 시각
  if (d.profileUpdatedAt) {
    const dt = d.profileUpdatedAt.toDate ? d.profileUpdatedAt.toDate() : new Date(d.profileUpdatedAt);
    document.getElementById('saveStatus').textContent = '마지막 저장: ' + fmtDateTime(dt);
  }

  updatePreview();
  bindPreviewListeners();
}

/* ── 실시간 프리뷰 ── */
function bindPreviewListeners() {
  ['inputName','inputTagline','inputPrice','inputRegion'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });
}

function updatePreview() {
  const name    = document.getElementById('inputName').value    || '이름';
  const tagline = document.getElementById('inputTagline').value || '전문 분야';
  const price   = document.getElementById('inputPrice').value;
  const region  = document.getElementById('inputRegion').value  || '활동 지역 미입력';

  document.getElementById('pvName').textContent   = name + ' 선생님';
  document.getElementById('pvSpec').textContent   = tagline;
  document.getElementById('pvPrice').textContent  = price ? price + '만원~' : '가격 미입력';
  document.getElementById('pvRegion').innerHTML   =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${region}`;
  document.getElementById('pvChips').innerHTML    = selectedSpecs.map(s =>
    `<span class="preview-chip">${s}</span>`
  ).join('');
}

/* ── 경력 데이터 수집 ── */
function collectCareers() {
  const entries = document.querySelectorAll('.career-entry');
  const result = [];
  entries.forEach(el => {
    const inputs = el.querySelectorAll('input');
    const period = inputs[0].value.trim();
    const title  = inputs[1].value.trim();
    const desc   = inputs[2].value.trim();
    if (period || title) result.push({ period, title, desc });
  });
  return result;
}

/* ── 저장 ── */
async function saveProfile() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { showToast('이름을 입력해주세요'); return; }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '저장 중...';

  const data = {
    name,
    avatar:        selectedAvatar,
    phone:         document.getElementById('inputPhone').value.trim(),
    tagline:       document.getElementById('inputTagline').value.trim(),
    bio:           document.getElementById('inputBio').value.trim(),
    specialties:   selectedSpecs,
    careerList:    collectCareers(),
    certifications: [...document.querySelectorAll('#certEntries .career-entry')].map(el => {
      const inputs = el.querySelectorAll('input');
      return { name: inputs[0].value.trim(), detail: inputs[1].value.trim() };
    }).filter(c => c.name),
    education: [...document.querySelectorAll('#eduEntries .career-entry')].map(el => {
      const inputs = el.querySelectorAll('input');
      return { school: inputs[0].value.trim(), detail: inputs[1].value.trim() };
    }).filter(e => e.school),
    price:         Number(document.getElementById('inputPrice').value) || null,
    region:        document.getElementById('inputRegion').value.trim(),
    availTime:     document.getElementById('inputAvailTime').value.trim(),
    duration:      document.getElementById('inputDuration').value,
    minVisit:      document.getElementById('inputMinVisit').value,
    profileUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };

  try {
    await db.collection('users').doc(currentUid).update(data);
    const now = new Date();
    document.getElementById('saveStatus').textContent = '마지막 저장: ' + fmtDateTime(now);
    showToast('✅ 프로필이 저장되었습니다!');
  } catch(e) {
    showToast('❌ 저장 중 오류가 발생했습니다.');
    console.error(e);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = '저장하기';
  }
}

/* ── 유틸 ── */
function esc(str) {
  return String(str || '').replace(/"/g, '&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDateTime(d) {
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0')
    + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
